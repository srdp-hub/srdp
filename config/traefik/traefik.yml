# Traefik's static configuration for local development.
#
# docker-compose.prod.yml replaces this file with the production static
# configuration (Let's Encrypt, no dashboard). It has to replace the whole
# file: Traefik reads its static configuration from exactly one source, and a
# configuration file found at startup wins over command-line flags and
# environment variables.
#
# Routing (the dynamic configuration) lives in config/traefik/dynamic/ and is
# loaded by the file provider below. Compose mounts each of those files
# individually into /etc/traefik/dynamic/, so an overlay can mount its own
# routing file next to them.

log:
  level: "INFO"
accessLog: {}
ping: {}

providers:
  file:
    directory: "/etc/traefik/dynamic"

entrypoints:
  web:
    address: ":80"
    http:
      redirections:
        entrypoint:
          to: "websecure"
          scheme: "https"
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}

api:
  dashboard: true # Enable the Traefik dashboard for debugging
  insecure: true # IMPORTANT: Only use 'insecure: true' for local development!
