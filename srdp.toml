# Central platform config (#42). Never holds secrets.
# Each table has its own consumer, which ignores the other tables.

# Read by the Justfile: image builds, kind loads and every Helm deploy.
[deploy]
# Registry prefix of every image this repo builds. The chart's defaults
# (global.srdpRegistry, the srdp-etl repository) must match it, a test checks.
registry = "rg.nl-ams.scw.cloud/srdp-registry"
# Base domain of every hostname: auth.<domain>, dagster.<domain>, and so on.
# The Justfile passes it to Docker Compose (SRDP_DOMAIN), to the mkcert
# certificates and to the local kind deploy. The prod recipes keep taking the
# domain from values-prod.yaml. The chart's defaults (global.domain and the
# values derived from it) must match it, a test checks.
domain = "srdp.localhost"

# Read by the srdp-setup service. The chart keeps its own copy in
# setup.databases, keep them in step.
[setup]

[[setup.databases]]
name = "zitadel"
role = "zitadel"

[[setup.databases]]
name = "dagster"
role = "dagster"

[[setup.databases]]
name = "marquez"
role = "marquez"

# DuckLake connects as the superuser (DUCKLAKE_PG_USER=postgres).
[[setup.databases]]
name = "ducklake"
