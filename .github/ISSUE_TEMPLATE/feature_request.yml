name: "✨ Feature request"
description: Suggest a new feature or enhancement for SRDP
labels: ["enhancement", "needs triage"]

body:
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: Describe the feature you would like to see added.
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What problem does this solve? Why is this needed?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If you have a specific implementation in mind, describe it here.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you have considered?

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is this for?
      multiple: true
      options:
        - "Platform: library (src/srdp/)"
        - "Platform: IO managers"
        - "Platform: Other"
        - "Orchestration: Dagster"
        - "Deploy: Docker Compose"
        - "Deploy: Kubernetes"
        - "Deploy: Other"
        - "Infra: Zitadel"
        - "Infra: Traefik"
        - "Infra: Other"
        - "Services: marimo"
        - "Services: Quarto"
        - "Services: Other"
        - "Documentation"
        - "CI/CD"
        - "Other"
