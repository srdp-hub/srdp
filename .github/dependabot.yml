version: 2
updates:
  # Workflow actions are pinned by commit SHA, Dependabot keeps them current.
  # A new release waits 7 days. Security updates skip the wait.
  # Minor and patch bumps come in one PR per month, a major gets its own PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Renovate owns the Dagster packages, together with the Dagster chart.
  # Minor and patch bumps come in one PR per month, a major gets its own PR.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "dagster*"

  # Container images, charts and Dockerfile bases are updated by Renovate
  # (renovate.json), grouped in one PR.
