name: Images

# Builds SRDP's platform images. On a pull request and on every push to
# main it builds and scans without pushing, so main stays buildable. On a published release it pushes by digest, scans that
# digest, signs it and attests its provenance, and only then adds the
# version tags, so a tag never points at an image that failed a check.
on:
  pull_request:
    paths:
      - ".github/workflows/images.yml"
      - ".trivyignore"
      - "deploy/docker/srdp-setup.Dockerfile"
      - "deploy/docker/dagster-webserver.Dockerfile"
      - "services/duckdb-ui/**"
      - "services/hub/**"
      - "config/dagster/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/images.yml"
      - ".trivyignore"
      - "deploy/docker/srdp-setup.Dockerfile"
      - "deploy/docker/dagster-webserver.Dockerfile"
      - "services/duckdb-ui/**"
      - "services/hub/**"
      - "config/dagster/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: &images
        include:
          - name: srdp-setup
            context: .
            dockerfile: deploy/docker/srdp-setup.Dockerfile
          - name: dagster-webserver
            context: .
            dockerfile: deploy/docker/dagster-webserver.Dockerfile
          - name: duckdb-ui
            context: .
            dockerfile: services/duckdb-ui/Dockerfile
          - name: hub
            context: services/hub
            dockerfile: services/hub/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.name }}:check

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:check
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      # Reported, not blocking: only srdp-setup runs as non-root today.
      - name: Report the user the image runs as
        env:
          IMAGE: ${{ matrix.name }}:check
        run: |
          user=$(docker inspect --format '{{.Config.User}}' "$IMAGE")
          case "$user" in
            ""|root|0|0:0) echo "::warning::$IMAGE runs as root" ;;
            *) echo "$IMAGE runs as $user" ;;
          esac

  version:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Same guards as publish.yml: a release can be published by hand
      # against any tag, so neither check can be assumed to have run.
      - name: Verify tagged commit is on main
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release $TAG_NAME points at a commit not reachable from main, refusing to publish."
            exit 1
          fi

      - name: Derive and check the version
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Release tag $TAG_NAME is not a version tag (vX.Y.Z or vX.Y.Z-pre)."
            exit 1
          fi
          version="${TAG_NAME#v}"
          project_version=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$project_version" != "$version" ]; then
            echo "::error::Release tag $TAG_NAME does not match pyproject.toml's version $project_version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Pre-releases only get their exact version, never the X.Y tag.
          if [ -z "${BASH_REMATCH[4]}" ]; then
            echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: *images
    env:
      IMAGE: ghcr.io/srdp-hub/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest only, without tags, until every check below passes.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max

      - name: Scan linux/amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Scan linux/arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature is tied to this workflow's GitHub OIDC identity.
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Version tags only, never latest, so a deployment always pins a version.
      # skopeo copies the signed index unchanged (--preserve-digests fails
      # instead of rewriting it), so a tag can only point at the signed digest.
      - name: Tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
          MINOR: ${{ needs.version.outputs.minor }}
        run: |
          tags=("$VERSION")
          if [ -n "$MINOR" ]; then tags+=("$MINOR"); fi
          for tag in "${tags[@]}"; do
            skopeo copy --all --preserve-digests \
              "docker://$IMAGE@$DIGEST" "docker://$IMAGE:$tag"
          done
