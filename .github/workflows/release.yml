name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} points at a commit not reachable from main, refusing to draft a release."
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          HEADING=$(grep -m1 "^## \[$VERSION\]" CHANGELOG.md | sed 's/^## //')

          # A pre-release is marked as one, and a stable release's notes start
          # at the previous stable tag, so v0.4.0 covers the rc builds too.
          PRERELEASE_FLAG=""
          NOTES_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PREVIOUS_STABLE=$(git tag --list 'v*' --sort=-v:refname | grep -v -e '-' -e "^$TAG_NAME$" | head -n 1)
            if [ -n "$PREVIOUS_STABLE" ]; then
              NOTES_ARGS=(-f previous_tag_name="$PREVIOUS_STABLE")
            fi
          fi

          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG_NAME" -f target_commitish=main "${NOTES_ARGS[@]}" --jq .body > notes.md

          if [ -n "$HEADING" ]; then
            ANCHOR=$(echo "$HEADING" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9 -]//g' | tr ' ' '-')
            {
              echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md#$ANCHOR) for the full categorized summary of what changed."
              echo ""
              cat notes.md
            } > combined-notes.md
          else
            cp notes.md combined-notes.md
          fi

          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --draft \
            $PRERELEASE_FLAG \
            --notes-file combined-notes.md
