name: Renovate

# Opens the weekly PR for images, charts and Dagster (renovate.json). Needs a
# RENOVATE_TOKEN secret (App token or PAT), since GITHUB_TOKEN PRs don't run CI.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_HOST_RULES: >-
            [{"matchHost": "dhi.io", "hostType": "docker",
            "username": "${{ secrets.DHI_USERNAME }}",
            "password": "${{ secrets.DHI_TOKEN }}"}]
