repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Kubernetes manifests (deploy/gitops) are multi-document files.
        args: [--allow-multiple-documents]
        # Helm templates are YAML *after* templating, `{{ ... }}` isn't valid YAML
        # on its own, so a generic parser can't validate them pre-render.
        exclude: ^deploy/kubernetes/srdp-chart/templates/
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
      - id: ruff-format

  # Terraform (Scaleway landing zone). Scoped to deploy/scaleway so the
  # superseded deploy/opentofu tree doesn't fail hooks it never ran under.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.106.0
    hooks:
      - id: terraform_fmt
        files: ^deploy/scaleway/
      - id: terraform_tflint
        files: ^deploy/scaleway/
        args:
          - --args=--config=__GIT_WORKING_DIR__/deploy/scaleway/.tflint.hcl

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: ^deploy/(scaleway|gitops)/
        args: [-c, deploy/scaleway/.yamllint]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check src/srdp
        language: system
        pass_filenames: false
        always_run: true
