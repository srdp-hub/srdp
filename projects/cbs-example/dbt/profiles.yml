cbs_example:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ":memory:"
      # srdp.io.dbt_plugin attaches the `ducklake` catalog with the same
      # DUCKLAKE_* settings as Dagster and the apps: the Postgres catalog, and
      # the data path or S3 bucket with its key. No storage settings here.
      plugins:
        - module: srdp.io.dbt_plugin
