# kind cluster config for local SRDP testing on macOS.
#
# Maps host 80/443 to the values.yaml-fixed Traefik NodePorts (30080/30443),
# so `https://*.srdp.localhost` works in the browser with no port suffix and
# no port-forward. The Docker Compose stack (deploy/docker/docker-compose.yml)
# publishes the same host ports, so run one stack at a time.
# Runs as plain containers on the existing Docker daemon, no separate VM,
# avoids the resource contention a VM-hosted control plane (e.g. Colima's
# k3s) can hit under load from image builds running at the same time.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: srdp
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
