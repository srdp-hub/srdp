# kind cluster config for local SRDP testing on macOS.
#
# Maps host 18080/18443 to the values.yaml-fixed Traefik NodePorts
# (30080/30443), so `https://*.srdp.localhost:18443` works in the browser
# with no port-forward. Deliberately not 80/443/8080: the Docker Compose
# stack (deploy/docker/docker-compose.yml) publishes exactly those three on
# the host already (http, https, Traefik dashboard), and both stacks should
# be usable side by side without tearing one down to start the other.
# Check deploy/docker/docker-compose.yml's published ports before changing
# these, so the two never collide again. Runs as plain containers on the
# existing Docker daemon, no separate VM, avoids the resource contention a
# VM-hosted control plane (e.g. Colima's k3s) can hit under load from image
# builds running at the same time.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: srdp
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        protocol: TCP
      - containerPort: 30443
        hostPort: 18443
        protocol: TCP
