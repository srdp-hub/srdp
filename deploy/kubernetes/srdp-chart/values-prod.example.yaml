# Global settings
global:
  domain: "LOAD_BALANCER_IP.nip.io" # CHANGE THIS to the dedicated domain
  postgresqlHost: "db-postgresql-primary"
  # The prod-* Justfile recipes override this and the srdp-etl repository
  # below with srdp.toml [deploy].registry. Change the registry there.
  srdpRegistry: "rg.nl-ams.scw.cloud/srdp-registry"
  # imagePullSecrets:
  #   - name: registry-key
  # The Dagster subcharts do not read global.imagePullSecrets. Set the same
  # list on dagster.imagePullSecrets and
  # dagster.dagster-user-deployments.imagePullSecrets, the latter also
  # reaches run pods through includeConfigInLaunchedRuns.

# No credentials in this file. Create the Secrets listed in values.yaml
# (srdp-postgres, srdp-zitadel, srdp-oauth2-proxy, srdp-dagster-postgresql,
# srdp-marquez) before installing, e.g. with External Secrets. srdp-postgres
# also needs replication-password here, because of architecture: replication.

# Traefik
traefik:
  service:
    spec:
      type: LoadBalancer
      clusterIP: ""

  podSecurityContext:
    fsGroup: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532

  # Enable Let's Encrypt ACME
  certResolver: "le"
  additionalArguments:
    - "--certificatesresolvers.le.acme.tlschallenge=true"
    - "--certificatesresolvers.le.acme.email=john@doe.com" # CHANGE THIS
    - "--certificatesresolvers.le.acme.storage=/data/acme.json"

  deployment:
    initContainers:
      - name: fix-acme-perms
        image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
          - sh
          - -c
          - |
            if [ -f /data/acme.json ]; then
              chmod 600 /data/acme.json
            fi
        volumeMounts:
          - name: data
            mountPath: /data

  # Persistence for certificates (so they survive pod restarts)
  persistence:
    enabled: true
    path: /data
    size: 1Gi

# In-cluster PostgreSQL with replication
zitadel-db:
  enabled: true
  architecture: replication

  readReplicas:
    replicaCount: 1
    persistence:
      enabled: true
      size: 4Gi

  backup:
    enabled: true
    cronjob:
      schedule: "0 2 * * *"
      storage:
        size: 8Gi
        resourcePolicy: "keep"

# Zitadel auth service
zitadel:
  zitadel:
    configmapConfig:
      ExternalDomain: "auth.LOAD_BALANCER_IP.nip.io" # CHANGE THIS (must match global.domain)
      ExternalPort: 443
      TLS:
        Enabled: false
      Database:
        Postgres:
          Host: "db-postgresql-primary"
          Port: 5432
          Database: "zitadel"
          User:
            Username: "zitadel"
            SSL:
              Mode: verify-full
          Admin:
            Username: "postgres"
            SSL:
              Mode: verify-full
      FirstInstance:
        Org:
          Human:
            UserName: zitadel-admin
            Email:
              Address: zitadel-admin@auth.LOAD_BALANCER_IP.nip.io
              Verified: true
            PasswordChangeRequired: false
    dbSslCaCrtSecret: postgres-cert
    dbSslAdminCrtSecret: postgres-cert
    dbSslUserCrtSecret: zitadel-cert

  initJob:
    initContainers:
      - name: wait-for-db
        image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL at db-postgresql-primary:5432..."
            until nc -z -v -w 2 db-postgresql-primary 5432; do
              echo "Waiting for DB..."
              sleep 2;
            done
            echo "PostgreSQL is up!"

  setupJob:
    initContainers:
      - name: wait-for-db
        image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL at db-postgresql-primary:5432..."
            until nc -z -v -w 2 db-postgresql-primary 5432; do
              echo "Waiting for DB..."
              sleep 2;
            done
            echo "PostgreSQL is up!"

  # Source: https://github.com/zitadel/zitadel/issues/11163
  login:
    customConfigmapConfig: |
      ZITADEL_SERVICE_USER_TOKEN_FILE="/login-client/pat"
      ZITADEL_API_URL="http://srdp-zitadel:8080"
      CUSTOM_REQUEST_HEADERS="Host:auth.LOAD_BALANCER_IP.nip.io,X-Zitadel-Public-Host:auth.LOAD_BALANCER_IP.nip.io" # CHANGE THIS

# O-Auth2 Proxy
oauth2-proxy:
  extraArgs:
    cookie-domain: ".LOAD_BALANCER_IP.nip.io" # CHANGE THIS
    whitelist-domain: ".LOAD_BALANCER_IP.nip.io" # CHANGE THIS
    oidc-issuer-url: "https://auth.LOAD_BALANCER_IP.nip.io" # CHANGE THIS
    cookie-secure: "false"

  customRequestHeaders:
    - "Host:auth.LOAD_BALANCER_IP.nip.io"

  # Remove hardcoded local aliases
  hostAliases: []

# Marimo app
marimo:
  enabled: true

# Quarto app, disabled by default, see values.yaml
quarto:
  enabled: false

# Dagster app
dagster:
  enabled: true
  # Literal host, the subchart doesn't tpl extraPrependedInitContainers.
  dagsterWebserver:
    extraPrependedInitContainers: &wait-for-dagster-db-prod
      - name: wait-for-dagster-db
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        command:
          - sh
          - -c
          - |
            for i in $(seq 1 60); do
              psql -tAc "SELECT 1" >/dev/null && exit 0
              echo "waiting for $PGUSER to log in to $PGDATABASE ($i/60)..."
              sleep 2
            done
            exit 1
        securityContext:
          runAsNonRoot: true
          runAsUser: 70
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        env:
          - name: PGHOST
            value: db-postgresql-primary
          - name: PGUSER
            value: dagster
          - name: PGDATABASE
            value: dagster
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: srdp-dagster-postgresql
                key: postgresql-password
  dagsterDaemon:
    extraPrependedInitContainers: *wait-for-dagster-db-prod
  postgresql:
    enabled: false
    postgresqlHost: db-postgresql-primary
    postgresqlUsername: dagster
    postgresqlDatabase: dagster
  dagster-user-deployments:
    deployments:
      - name: srdp-etl
        image:
          repository: "rg.nl-ams.scw.cloud/srdp-registry/srdp-etl" # Set from srdp.toml by the Justfile
          tag: "v1.0"
          pullPolicy: IfNotPresent
        dagsterApiGrpcArgs:
          - "-m"
          - "etl.definitions"
        port: 3030
        initContainers:
          - name: wait-for-ducklake-db
            image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
            command:
              - sh
              - -c
              - |
                for i in $(seq 1 60); do
                  psql -tAc "SELECT 1" >/dev/null && exit 0
                  echo "waiting for $PGUSER to log in to $PGDATABASE ($i/60)..."
                  sleep 2
                done
                exit 1
            securityContext:
              runAsNonRoot: true
              runAsUser: 70
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            env:
              - name: PGHOST
                value: db-postgresql-primary
              - name: PGUSER
                value: postgres
              - name: PGDATABASE
                value: ducklake
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: srdp-postgres
                    key: postgres-password
        # See values.yaml: shared DuckLake volume, copied into run pods.
        # A multi-node cluster needs ducklakeData.accessMode: ReadWriteMany.
        volumes:
          - name: ducklake-data
            persistentVolumeClaim:
              claimName: ducklake-data
        volumeMounts:
          - name: ducklake-data
            mountPath: /data/ducklake
        env:
          - name: DUCKLAKE_PG_HOST
            value: db-postgresql-primary
          - name: DUCKLAKE_PG_USER
            value: postgres
          - name: DUCKLAKE_PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: srdp-postgres
                key: postgres-password
          - name: DUCKLAKE_PG_DB
            value: ducklake
          - name: DUCKLAKE_DATA_PATH
            value: /data/ducklake
