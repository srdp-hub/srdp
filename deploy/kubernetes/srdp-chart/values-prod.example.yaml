# Global settings
global:
  domain: "LOAD_BALANCER_IP.nip.io" # CHANGE THIS to the dedicated domain
  postgresqlHost: "db-postgresql-primary"
  # The prod-* Justfile recipes override this and the srdp-etl repository
  # below with srdp.toml [deploy].registry. Change the registry there.
  srdpRegistry: "rg.nl-ams.scw.cloud/srdp-registry"
  # imagePullSecrets:
  #   - name: registry-key
  # The Dagster subcharts do not read global.imagePullSecrets. Set the same
  # list on dagster.imagePullSecrets and
  # dagster.dagster-user-deployments.imagePullSecrets, the latter also
  # reaches run pods through includeConfigInLaunchedRuns.

# No credentials in this file. Create the Secrets listed in values.yaml
# (srdp-postgres, srdp-zitadel, srdp-oauth2-proxy, srdp-dagster-postgresql,
# srdp-marquez) before installing, e.g. with External Secrets. srdp-postgres
# also needs replication-password here, because of architecture: replication.
# DuckLake runs on S3 below, so also create srdp-ducklake-s3-writer and
# srdp-ducklake-s3-reader, each with DUCKLAKE_S3_KEY_ID and DUCKLAKE_S3_SECRET.

# DuckLake's Parquet files in object storage. A ReadWriteOnce data volume would
# pin every DuckLake pod to one node, so there is none: the Dagster code
# location below mounts no volume either.
ducklakeStorage:
  backend: s3
  s3:
    bucket: "srdp-lakehouse" # CHANGE THIS
    prefix: "prod" # CHANGE THIS, one prefix per environment
    endpoint: "s3.nl-ams.scw.cloud" # CHANGE THIS to your object storage endpoint
    urlStyle: vhost
    region: "nl-ams" # CHANGE THIS to match the endpoint
    useSsl: true

ducklakeData:
  enabled: false

# Traefik
traefik:
  service:
    spec:
      type: LoadBalancer
      clusterIP: ""

  podSecurityContext:
    fsGroup: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532

  # Enable Let's Encrypt ACME
  certResolver: "le"
  additionalArguments:
    - "--certificatesresolvers.le.acme.tlschallenge=true"
    - "--certificatesresolvers.le.acme.email=john@doe.com" # CHANGE THIS
    - "--certificatesresolvers.le.acme.storage=/data/acme.json"

  deployment:
    initContainers:
      - name: fix-acme-perms
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            if [ -f /data/acme.json ]; then
              chmod 600 /data/acme.json
            fi
        volumeMounts:
          - name: data
            mountPath: /data

  # Persistence for certificates (so they survive pod restarts)
  persistence:
    enabled: true
    path: /data
    size: 1Gi

# In-cluster PostgreSQL with replication
zitadel-db:
  enabled: true
  architecture: replication

  readReplicas:
    replicaCount: 1
    persistence:
      enabled: true
      size: 4Gi

  backup:
    enabled: true
    cronjob:
      schedule: "0 2 * * *"
      storage:
        size: 8Gi
        resourcePolicy: "keep"

# Zitadel auth service
zitadel:
  zitadel:
    configmapConfig:
      ExternalDomain: "auth.LOAD_BALANCER_IP.nip.io" # CHANGE THIS (must match global.domain)
      ExternalPort: 443
      TLS:
        Enabled: false
      Database:
        Postgres:
          Host: "db-postgresql-primary"
          Port: 5432
          Database: "zitadel"
          User:
            Username: "zitadel"
            SSL:
              Mode: verify-full
          Admin:
            Username: "postgres"
            SSL:
              Mode: verify-full
      FirstInstance:
        Org:
          Human:
            UserName: zitadel-admin
            Email:
              Address: zitadel-admin@auth.LOAD_BALANCER_IP.nip.io
              Verified: true
            PasswordChangeRequired: false
    dbSslCaCrtSecret: postgres-cert
    dbSslAdminCrtSecret: postgres-cert
    dbSslUserCrtSecret: zitadel-cert

  initJob:
    initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL at db-postgresql-primary:5432..."
            until nc -z -v -w 2 db-postgresql-primary 5432; do
              echo "Waiting for DB..."
              sleep 2;
            done
            echo "PostgreSQL is up!"

  setupJob:
    initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL at db-postgresql-primary:5432..."
            until nc -z -v -w 2 db-postgresql-primary 5432; do
              echo "Waiting for DB..."
              sleep 2;
            done
            echo "PostgreSQL is up!"

  # Source: https://github.com/zitadel/zitadel/issues/11163
  login:
    customConfigmapConfig: |
      ZITADEL_SERVICE_USER_TOKEN_FILE="/login-client/pat"
      ZITADEL_API_URL="http://srdp-zitadel:8080"
      CUSTOM_REQUEST_HEADERS="Host:auth.LOAD_BALANCER_IP.nip.io,X-Zitadel-Public-Host:auth.LOAD_BALANCER_IP.nip.io" # CHANGE THIS

# O-Auth2 Proxy
oauth2-proxy:
  extraArgs:
    cookie-domain: ".LOAD_BALANCER_IP.nip.io" # CHANGE THIS
    whitelist-domain: ".LOAD_BALANCER_IP.nip.io" # CHANGE THIS
    oidc-issuer-url: "https://auth.LOAD_BALANCER_IP.nip.io" # CHANGE THIS
    cookie-secure: "false"

  customRequestHeaders:
    - "Host:auth.LOAD_BALANCER_IP.nip.io"

  # Remove hardcoded local aliases
  hostAliases: []

# Marimo app
marimo:
  enabled: true

# Quarto app, disabled by default, see values.yaml
quarto:
  enabled: false

# Dagster app
dagster:
  enabled: true
  # Literal host, the subchart doesn't tpl extraPrependedInitContainers.
  dagsterWebserver:
    extraPrependedInitContainers: &wait-for-dagster-db-prod
      - name: wait-for-dagster-db
        image: postgres:17-alpine
        command:
          - sh
          - -c
          - |
            for i in $(seq 1 60); do
              psql -tAc "SELECT 1" >/dev/null && exit 0
              echo "waiting for $PGUSER to log in to $PGDATABASE ($i/60)..."
              sleep 2
            done
            exit 1
        securityContext:
          runAsNonRoot: true
          runAsUser: 70
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        env:
          - name: PGHOST
            value: db-postgresql-primary
          - name: PGUSER
            value: dagster
          - name: PGDATABASE
            value: dagster
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: srdp-dagster-postgresql
                key: postgresql-password
  dagsterDaemon:
    extraPrependedInitContainers: *wait-for-dagster-db-prod
  postgresql:
    enabled: false
    postgresqlHost: db-postgresql-primary
    postgresqlUsername: dagster
    postgresqlDatabase: dagster
  dagster-user-deployments:
    deployments:
      - name: srdp-etl
        image:
          repository: "rg.nl-ams.scw.cloud/srdp-registry/srdp-etl" # Set from srdp.toml by the Justfile
          tag: "v1.0"
          pullPolicy: IfNotPresent
        dagsterApiGrpcArgs:
          - "-m"
          - "etl.definitions"
        port: 3030
        initContainers:
          - name: wait-for-ducklake-db
            image: postgres:17-alpine
            command:
              - sh
              - -c
              - |
                for i in $(seq 1 60); do
                  psql -tAc "SELECT 1" >/dev/null && exit 0
                  echo "waiting for $PGUSER to log in to $PGDATABASE ($i/60)..."
                  sleep 2
                done
                exit 1
            securityContext:
              runAsNonRoot: true
              runAsUser: 70
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            env:
              - name: PGHOST
                value: db-postgresql-primary
              - name: PGUSER
                value: postgres
              - name: PGDATABASE
                value: ducklake
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: srdp-postgres
                    key: postgres-password
          - name: wait-for-ducklake-bucket
            # Same container as srdp.waitForDucklakeBucket in templates/_helpers.tpl,
            # with the writer key. includeConfigInLaunchedRuns copies it into
            # every run pod, so no run starts before the bucket exists.
            image: curlimages/curl:8.22.0
            securityContext:
              runAsNonRoot: true
              runAsUser: 100
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            envFrom:
              - configMapRef:
                  name: srdp-ducklake-storage
            env:
              - name: DUCKLAKE_S3_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: srdp-ducklake-s3-writer
                    key: DUCKLAKE_S3_KEY_ID
                    optional: true
              - name: DUCKLAKE_S3_SECRET
                valueFrom:
                  secretKeyRef:
                    name: srdp-ducklake-s3-writer
                    key: DUCKLAKE_S3_SECRET
                    optional: true
            command:
              - sh
              - -c
              - |
                if [ "$DUCKLAKE_STORAGE_BACKEND" != "s3" ]; then exit 0; fi
                scheme=https
                if [ "$DUCKLAKE_S3_USE_SSL" = "false" ]; then scheme=http; fi
                # The list request DuckDB makes on s3://<bucket>/<prefix>/, in its URL style,
                # so a key scoped to the prefix passes too. The chart allows only
                # [A-Za-z0-9._/-] in the prefix, so / is the one character to encode.
                prefix=$(printf '%s' "$DUCKLAKE_S3_PREFIX" | sed -e 's#^/*##' -e 's#/*$##')
                if [ -n "$prefix" ]; then prefix="$(printf '%s' "$prefix" | sed 's#/#%2F#g')%2F"; fi
                query="list-type=2&max-keys=1&prefix=$prefix"
                if [ "$DUCKLAKE_S3_URL_STYLE" = "vhost" ]; then
                  url="$scheme://$DUCKLAKE_S3_BUCKET.$DUCKLAKE_S3_ENDPOINT/?$query"
                else
                  url="$scheme://$DUCKLAKE_S3_ENDPOINT/$DUCKLAKE_S3_BUCKET?$query"
                fi
                for i in $(seq 1 60); do
                  # The key goes in through stdin, so it never shows in the process list.
                  code=$(printf 'user = "%s:%s"\n' "$DUCKLAKE_S3_KEY_ID" "$DUCKLAKE_S3_SECRET" |
                    curl -s -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 10 \
                        -K - --aws-sigv4 "aws:amz:$DUCKLAKE_S3_REGION:s3" "$url")
                  if [ "$code" = "200" ]; then exit 0; fi
                  echo "waiting for bucket $DUCKLAKE_S3_BUCKET at $DUCKLAKE_S3_ENDPOINT, HTTP $code ($i/60)..."
                  sleep 2
                done
                echo "bucket $DUCKLAKE_S3_BUCKET still unreachable with this pod's key after 60 attempts, giving up." >&2
                exit 1
        # No ducklake-data volume: DuckLake keeps its files in the bucket, see
        # ducklakeStorage above.
        # DUCKLAKE_STORAGE_BACKEND and the S3 settings, see ducklakeStorage.
        envConfigMaps:
          - name: srdp-ducklake-storage
        env:
          - name: DUCKLAKE_PG_HOST
            value: db-postgresql-primary
          - name: DUCKLAKE_PG_USER
            value: postgres
          - name: DUCKLAKE_PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: srdp-postgres
                key: postgres-password
          - name: DUCKLAKE_PG_DB
            value: ducklake
          - name: DUCKLAKE_DATA_PATH
            value: /data/ducklake
          # The writer key, for DUCKLAKE_STORAGE_BACKEND=s3. Optional, so
          # local storage needs no such Secret. Only this code location and
          # its run pods hold it, the apps get the read-only key.
          - name: DUCKLAKE_S3_KEY_ID
            valueFrom:
              secretKeyRef:
                name: srdp-ducklake-s3-writer
                key: DUCKLAKE_S3_KEY_ID
                optional: true
          - name: DUCKLAKE_S3_SECRET
            valueFrom:
              secretKeyRef:
                name: srdp-ducklake-s3-writer
                key: DUCKLAKE_S3_SECRET
                optional: true
