{{- if .Values.duckdbUi.enabled }}
---
# Protected DuckDB UI Routes
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duckdb-ui-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-oauth-errors@kubernetescrd,{{ .Release.Namespace }}-oauth-auth@kubernetescrd
spec:
  ingressClassName: srdp-traefik
  tls:
    - hosts:
        - duckdb.{{ .Values.global.domain }}
      {{- if .Values.traefik.certResolver }}
      secretName: duckdb-ui-tls-prod
      {{- else }}
      secretName: custom-ingress-cert
      {{- end }}
  rules:
    - host: duckdb.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: duckdb-ui
                port:
                  number: 80
---
# DuckDB UI's own API surface (/localToken, /localEvents, /ddb/*): keep the
# real auth check but skip the errors-middleware's 401-rewrite, since these
# paths can legitimately 401 from DuckDB's own server, not from SSO (see
# services/duckdb-ui/ and projects/cbs-example/README.md for the full story).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duckdb-ui-internal-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-oauth-auth@kubernetescrd
spec:
  ingressClassName: srdp-traefik
  tls:
    - hosts:
        - duckdb.{{ .Values.global.domain }}
      {{- if .Values.traefik.certResolver }}
      secretName: duckdb-ui-tls-prod
      {{- else }}
      secretName: custom-ingress-cert
      {{- end }}
  rules:
    - host: duckdb.{{ .Values.global.domain }}
      http:
        paths:
          - path: /localToken
            pathType: Exact
            backend:
              service:
                name: duckdb-ui
                port:
                  number: 80
          - path: /localEvents
            pathType: Exact
            backend:
              service:
                name: duckdb-ui
                port:
                  number: 80
          - path: /ddb/
            pathType: Prefix
            backend:
              service:
                name: duckdb-ui
                port:
                  number: 80
{{- end }}

