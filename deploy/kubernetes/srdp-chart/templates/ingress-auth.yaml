{{- if and (index .Values "oauth2-proxy" "enabled") (or .Values.marimo.enabled .Values.quarto.enabled .Values.dagster.enabled .Values.api.enabled .Values.duckdbUi.enabled .Values.hub.enabled .Values.marquez.enabled) }}
# Middlewares
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth-auth
  namespace: {{ .Release.Namespace }}
spec:
  forwardAuth:
    address: "http://srdp-oauth2-proxy.{{ .Release.Namespace }}.svc.cluster.local:80/oauth2/auth"
    trustForwardHeader: true
    authResponseHeaders:
      - "X-Auth-Request-User"
      - "X-Auth-Request-Email"
      - "X-Auth-Request-Token"

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth-errors
  namespace: {{ .Release.Namespace }}
spec:
  errors:
    status:
      - "401-403"
    service:
      name: srdp-oauth2-proxy
      port: 80
    query: "/oauth2/sign_in"
    statusRewrites:
      "401": 302

---
# Public Auth Routes
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-routes-ingress
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: srdp-traefik
  tls:
    - hosts:
{{- if .Values.marimo.enabled }}
        - marimo.{{ .Values.global.domain }}
{{- end }}
{{- if .Values.quarto.enabled }}
        - quarto.{{ .Values.global.domain }}
{{- end }}
{{- if .Values.dagster.enabled }}
        - dagster.{{ .Values.global.domain }}
{{- end }}
{{- if .Values.api.enabled }}
        - api.{{ .Values.global.domain }}
{{- end }}
{{- if .Values.duckdbUi.enabled }}
        - duckdb.{{ .Values.global.domain }}
{{- end }}
{{- if .Values.hub.enabled }}
        - {{ .Values.global.domain }}
{{- end }}
{{- if .Values.marquez.enabled }}
        - marquez.{{ .Values.global.domain }}
{{- end }}
      {{- if .Values.traefik.certResolver }}
      secretName: {{ .Values.global.domain | replace "." "-" }}-tls
      {{- else }}
      secretName: custom-ingress-cert
      {{- end }}
  rules:
{{- if .Values.marimo.enabled }}
    - host: marimo.{{ .Values.global.domain }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: srdp-oauth2-proxy
                port:
                  number: 80
{{- end }}
{{- if .Values.quarto.enabled }}
    - host: quarto.{{ .Values.global.domain }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: srdp-oauth2-proxy
                port:
                  number: 80
{{- end }}
{{- if .Values.dagster.enabled }}
    - host: dagster.{{ .Values.global.domain }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: srdp-oauth2-proxy
                port:
                  number: 80
{{- end }}
{{- if .Values.api.enabled }}
    - host: api.{{ .Values.global.domain }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: srdp-oauth2-proxy
                port:
                  number: 80
{{- end }}
{{- if .Values.duckdbUi.enabled }}
    - host: duckdb.{{ .Values.global.domain }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: srdp-oauth2-proxy
                port:
                  number: 80
{{- end }}
{{- if .Values.hub.enabled }}
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: srdp-oauth2-proxy
                port:
                  number: 80
{{- end }}
{{- if .Values.marquez.enabled }}
    - host: marquez.{{ .Values.global.domain }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: srdp-oauth2-proxy
                port:
                  number: 80
{{- end }}

{{- if .Values.marimo.enabled }}
---
# Protected Marimo Routes
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marimo-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-oauth-errors@kubernetescrd,{{ .Release.Namespace }}-oauth-auth@kubernetescrd
spec:
  ingressClassName: srdp-traefik
  tls:
    - hosts:
        - marimo.{{ .Values.global.domain }}
      {{- if .Values.traefik.certResolver }}
      secretName: marimo-tls-prod
      {{- else }}
      secretName: custom-ingress-cert
      {{- end }}
  rules:
    - host: marimo.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: marimo
                port:
                  number: 80
{{- end }}

