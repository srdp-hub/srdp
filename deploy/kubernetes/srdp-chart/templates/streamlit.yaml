{{- if .Values.streamlit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  labels:
    app: streamlit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit
  template:
    metadata:
      {{- include "srdp.localSecretsChecksum" . | nindent 6 }}
      labels:
        app: streamlit
    spec:
      {{- include "srdp.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "srdp.waitForDucklakeDb" . | nindent 8 }}
      containers:
        - name: streamlit
          image: {{ include "srdp.image" (list . .Values.streamlit.image) }}
          imagePullPolicy: {{ .Values.streamlit.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            {{- include "srdp.ducklakeEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "srdp.ducklakeVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "srdp.ducklakeVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit
spec:
  selector:
    app: streamlit
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
{{- end }}
