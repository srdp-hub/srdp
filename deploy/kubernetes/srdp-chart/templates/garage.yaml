{{- /*
Garage: a single-node S3-compatible server for testing DuckLake on S3 in kind
(values-local-s3.yaml). Not for production, where ducklakeStorage.s3 points
at real object storage instead. The srdp-setup Job's Garage step creates the
bucket and the writer and reader keys, see src/srdp/setup/garage.py.
*/ -}}
{{- if .Values.garage.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
data:
  # No secrets here: GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN come from the
  # srdp-garage Secret, Garage reads both from the environment.
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"

    [s3_api]
    s3_region = {{ .Values.ducklakeStorage.s3.region | default "garage" | quote }}
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.garage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  labels:
    app: garage
spec:
  replicas: 1
  # One ReadWriteOnce volume: the old pod must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: "{{ .Values.garage.image.repository }}:{{ .Values.garage.image.tag }}"
          imagePullPolicy: {{ .Values.garage.image.pullPolicy }}
          ports:
            - name: s3
              containerPort: 3900
            - name: admin
              containerPort: 3903
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: srdp-garage
                  key: rpc-secret
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: srdp-garage
                  key: admin-token
          readinessProbe:
            tcpSocket:
              port: s3
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: data
              mountPath: /var/lib/garage
      volumes:
        - name: config
          configMap:
            name: garage-config
        - name: data
          persistentVolumeClaim:
            claimName: garage-data
---
apiVersion: v1
kind: Service
metadata:
  name: garage
spec:
  selector:
    app: garage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
    - name: admin
      port: 3903
      targetPort: admin
{{- end }}
