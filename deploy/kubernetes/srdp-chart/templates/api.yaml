{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: DUCKLAKE_PG_HOST
              value: db-postgresql
            - name: DUCKLAKE_PG_USER
              value: postgres
            - name: DUCKLAKE_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-postgresql
                  key: postgres-password
            - name: DUCKLAKE_PG_DB
              value: ducklake
            - name: DAGSTER_GRAPHQL_URL
              value: "http://{{ .Release.Name }}-dagster-webserver.{{ .Release.Namespace }}.svc.cluster.local:80/graphql"
          # DUCKLAKE_DATA_PATH / shared storage isn't wired yet, same open
          # question as dagster-code's own storage (see ADR-0010 and the
          # kubernetes-rollout-plan): needs a shared volume decision first.
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
{{- end }}
