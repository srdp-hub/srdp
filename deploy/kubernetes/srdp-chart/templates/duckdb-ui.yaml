{{- if .Values.duckdbUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duckdb-ui
  labels:
    app: duckdb-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: duckdb-ui
  template:
    metadata:
      {{- include "srdp.localSecretsChecksum" . | nindent 6 }}
      labels:
        app: duckdb-ui
    spec:
      {{- include "srdp.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "srdp.waitForDucklakeDb" . | nindent 8 }}
        {{- include "srdp.waitForDucklakeBucket" "srdp-ducklake-s3-reader" | nindent 8 }}
      containers:
        - name: duckdb-ui
          image: {{ include "srdp.image" (list . .Values.duckdbUi.image) }}
          imagePullPolicy: {{ .Values.duckdbUi.image.pullPolicy }}
          ports:
            - containerPort: 4213
          envFrom:
            {{- include "srdp.ducklakeEnvFrom" . | nindent 12 }}
          env:
            {{- include "srdp.ducklakeEnv" . | nindent 12 }}
          {{- include "srdp.ducklakeVolumeMounts" . | nindent 10 }}
      {{- include "srdp.ducklakeVolumes" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: duckdb-ui
spec:
  selector:
    app: duckdb-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4213
{{- end }}
