{{- /*
Development Secrets for kind, rendered only when localSecrets.enabled is set
(values-local.yaml). In the cloud this stays off and External Secrets creates
Secrets with the same names and keys (ticket 4). Every consumer reads these
fixed names, so the two sources are interchangeable.
*/ -}}
{{- if .Values.localSecrets.enabled }}
{{- $s := .Values.localSecrets }}
# PostgreSQL superuser and zitadel user, read by the zitadel-db subchart
# (auth.existingSecret) and every DuckLake client.
apiVersion: v1
kind: Secret
metadata:
  name: srdp-postgres
type: Opaque
stringData:
  postgres-password: {{ required "localSecrets.postgres.postgresPassword" $s.postgres.postgresPassword | quote }}
  password: {{ required "localSecrets.postgres.zitadelPassword" $s.postgres.zitadelPassword | quote }}
---
# Zitadel's masterkey and the secret part of its config, merged by Zitadel
# with configmapConfig (zitadel.zitadel.configSecretName).
apiVersion: v1
kind: Secret
metadata:
  name: srdp-zitadel
type: Opaque
stringData:
  masterkey: {{ required "localSecrets.zitadel.masterkey" $s.zitadel.masterkey | quote }}
  config-yaml: |
    {{- dict
      "Database" (dict "Postgres" (dict
        "User" (dict "Password" $s.postgres.zitadelPassword)
        "Admin" (dict "Password" $s.postgres.postgresPassword)))
      "FirstInstance" (dict "Org" (dict "Human" (dict "Password" (required "localSecrets.zitadel.adminPassword" $s.zitadel.adminPassword))))
      | toYaml | nindent 4 }}
---
# oauth2-proxy (oauth2-proxy.config.existingSecret), key names fixed by that chart.
apiVersion: v1
kind: Secret
metadata:
  name: srdp-oauth2-proxy
type: Opaque
stringData:
  client-id: {{ required "localSecrets.oauth2Proxy.clientID" $s.oauth2Proxy.clientID | quote }}
  client-secret: {{ required "localSecrets.oauth2Proxy.clientSecret" $s.oauth2Proxy.clientSecret | quote }}
  cookie-secret: {{ required "localSecrets.oauth2Proxy.cookieSecret" $s.oauth2Proxy.cookieSecret | quote }}
---
# Dagster's metadata database (dagster.global.postgresqlSecretName), key name
# fixed by the dagster chart. The srdp-setup Job sets the role to this too.
apiVersion: v1
kind: Secret
metadata:
  name: srdp-dagster-postgresql
type: Opaque
stringData:
  postgresql-password: {{ required "localSecrets.dagster.dbPassword" $s.dagster.dbPassword | quote }}
---
# Marquez's database role, read by Marquez and the srdp-setup Job.
apiVersion: v1
kind: Secret
metadata:
  name: srdp-marquez
type: Opaque
stringData:
  db-password: {{ required "localSecrets.marquez.dbPassword" $s.marquez.dbPassword | quote }}
{{- end }}
