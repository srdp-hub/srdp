# Where DuckLake keeps its Parquet files, read through envFrom by the Dagster
# code location, its run pods and the four apps. See ducklakeStorage in
# values.yaml. The S3 keys are not here, they come from a role Secret.
{{- $s := .Values.ducklakeStorage }}
{{- if not (has $s.backend (list "local" "s3")) }}
{{- fail "ducklakeStorage.backend must be local or s3" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: srdp-ducklake-storage
data:
  DUCKLAKE_STORAGE_BACKEND: {{ $s.backend | quote }}
  {{- if eq $s.backend "s3" }}
  DUCKLAKE_S3_BUCKET: {{ required "ducklakeStorage.s3.bucket" $s.s3.bucket | quote }}
  DUCKLAKE_S3_PREFIX: {{ $s.s3.prefix | quote }}
  DUCKLAKE_S3_ENDPOINT: {{ required "ducklakeStorage.s3.endpoint" $s.s3.endpoint | quote }}
  DUCKLAKE_S3_URL_STYLE: {{ required "ducklakeStorage.s3.urlStyle" $s.s3.urlStyle | quote }}
  DUCKLAKE_S3_REGION: {{ required "ducklakeStorage.s3.region" $s.s3.region | quote }}
  DUCKLAKE_S3_USE_SSL: {{ $s.s3.useSsl | quote }}
  {{- end }}
