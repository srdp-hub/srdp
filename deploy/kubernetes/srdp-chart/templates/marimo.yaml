{{- if .Values.marimo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marimo
  labels:
    app: marimo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marimo
  template:
    metadata:
      {{- include "srdp.localSecretsChecksum" . | nindent 6 }}
      labels:
        app: marimo
    spec:
      {{- include "srdp.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "srdp.waitForDucklakeDb" . | nindent 8 }}
        {{- include "srdp.waitForDucklakeBucket" "srdp-ducklake-s3-reader" | nindent 8 }}
      containers:
        - name: marimo
          image: {{ include "srdp.image" (list . .Values.marimo.image) }}
          imagePullPolicy: {{ .Values.marimo.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            {{- include "srdp.ducklakeEnvFrom" . | nindent 12 }}
          env:
            {{- include "srdp.ducklakeEnv" . | nindent 12 }}
          {{- include "srdp.ducklakeVolumeMounts" . | nindent 10 }}
      {{- include "srdp.ducklakeVolumes" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: marimo
spec:
  selector:
    app: marimo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
{{- end }}
