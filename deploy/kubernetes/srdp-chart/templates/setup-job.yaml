{{- if .Values.setup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: srdp-setup
  annotations:
    # Post-install because Postgres doesn't exist yet during pre-install. Consumers
    # block on this Job, so `helm --wait`/`--atomic` would deadlock.
    helm.sh/hook: post-install,post-upgrade
    # Before zitadel-init (-5), so a Zitadel failure can't block the databases.
    helm.sh/hook-weight: "-10"
    # Kept after success, so `kubectl logs job/srdp-setup` shows the last run.
    # The next install or upgrade replaces it.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 240
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- include "srdp.imagePullSecrets" . | nindent 6 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: srdp-setup
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          image: {{ include "srdp.image" (list . .Values.setup.image) }}
          imagePullPolicy: {{ .Values.setup.image.pullPolicy }}
          env:
            - name: SETUP_PG_HOST
              value: {{ .Values.global.postgresqlHost | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srdp-postgres
                  key: postgres-password
            # Same Secret keys the consumers read, otherwise the Job resets a
            # role to a password its application does not know.
            - name: SETUP_PASSWORDS__DAGSTER
              valueFrom:
                secretKeyRef:
                  name: srdp-dagster-postgresql
                  key: postgresql-password
            - name: SETUP_PASSWORDS__MARQUEZ
              valueFrom:
                secretKeyRef:
                  name: srdp-marquez
                  key: db-password
            {{- if .Values.garage.enabled }}
            # The optional Garage step (src/srdp/setup/garage.py), only with
            # the bundled Garage. It imports the role Secrets the DuckLake
            # consumers read, so Garage accepts exactly the keys they get.
            - name: GARAGE_ADMIN_URL
              value: "http://garage:3903"
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: srdp-garage
                  key: admin-token
            - name: GARAGE_BUCKET
              value: {{ required "ducklakeStorage.s3.bucket" .Values.ducklakeStorage.s3.bucket | quote }}
            - name: GARAGE_WRITER_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: srdp-ducklake-s3-writer
                  key: DUCKLAKE_S3_KEY_ID
            - name: GARAGE_WRITER_SECRET
              valueFrom:
                secretKeyRef:
                  name: srdp-ducklake-s3-writer
                  key: DUCKLAKE_S3_SECRET
            - name: GARAGE_READER_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: srdp-ducklake-s3-reader
                  key: DUCKLAKE_S3_KEY_ID
            - name: GARAGE_READER_SECRET
              valueFrom:
                secretKeyRef:
                  name: srdp-ducklake-s3-reader
                  key: DUCKLAKE_S3_SECRET
            {{- end }}
          volumeMounts:
            - name: setup-config
              mountPath: /etc/srdp
              readOnly: true
      volumes:
        - name: setup-config
          configMap:
            name: srdp-setup-config
{{- end }}
