# Global settings
global:
  domain: "srdp.localhost"

# Traefik
traefik:
  enabled: true
  service:
    spec: {}
  # clusterIP is intentionally not pinned here: it must fall inside the
  # cluster's actual service CIDR, which varies by cluster (kind/Docker
  # Desktop default to 10.96.0.0/12, k3s to 10.43.0.0/16, ...). Kubernetes
  # assigns one dynamically; `just local-deploy` reads it back and feeds it
  # into oauth2-proxy.hostAliases below in a second pass.
  ports:
    web:
      nodePort: 30080
    websecure:
      nodePort: 30443

# Local PostgreSQL
zitadel-db:
  enabled: true
  fullnameOverride: "db-postgresql"
  auth:
    database: zitadel
    postgresPassword: "srdpTest123"
    username: zitadel
    password: srdpTest123
  image:
    repository: bitnami/postgresql
  metrics:
    image:
      repository: bitnami/postgres-exporter
  primary:
    initdb:
      user: postgres
      password: srdpTest123
      scripts:
        01-create-dagster.sql: |
          CREATE USER dagster WITH PASSWORD 'srdpTest123';
          CREATE DATABASE dagster OWNER dagster;
          GRANT ALL PRIVILEGES ON DATABASE dagster TO dagster;
        02-create-marquez.sql: |
          -- Marquez (OpenLineage backend). Credentials match marquez.dev.yml's
          -- hardcoded defaults (db.user/db.password = "marquez"), no env-var
          -- override for those two in the image's default config, only
          -- POSTGRES_HOST/POSTGRES_PORT are templated. Mirrors
          -- deploy/docker/initdb's compose equivalent.
          CREATE USER marquez WITH PASSWORD 'marquez';
          CREATE DATABASE marquez OWNER marquez;
    persistence:
      enabled: true
      size: 4Gi
  volumePermissions:
    enabled: true
    image:
      repository: bitnami/os-shell
  tls:
    enabled: true
    certificatesSecret: postgres-cert
    certFilename: "tls.crt"
    certKeyFilename: "tls.key"
  backup:
    enabled: true
    cronjob:
      schedule: "0 2 * * *"
      storage:
        size: 8Gi
        resourcePolicy: "keep"

# Zitadel auth service
zitadel:
  enabled: true
  zitadel:
    masterkey: "51a69a373f45c60d2ae08c48bb89d03e" # Must be 32 characaters
    secretConfig:
      Database:
        Postgres:
          User:
            Password: srdpTest123
          Admin:
            Password: srdpTest123
    configmapConfig:
      ExternalDomain: auth.srdp.localhost
      ExternalPort: 443
      TLS:
        Enabled: false
      FirstInstance:
        Org:
          Human:
            Password: "srdpTest123!"
            PasswordChangeRequired: false
      Database:
        Postgres:
          Host: db-postgresql
          Port: 5432
          Database: zitadel
          User:
            Username: zitadel
            SSL:
              Mode: verify-full
          Admin:
            Username: postgres
            SSL:
              Mode: verify-full
    dbSslCaCrtSecret: postgres-cert
    dbSslAdminCrtSecret: postgres-cert
    dbSslUserCrtSecret: zitadel-cert
  image:
    tag: "v4.11.1"

  ingress:
    enabled: false

  login:
    enabled: true
    ingress:
      enabled: false
    image:
      tag: "v4.11.1"

  initJob:
    annotations:
      "helm.sh/hook": post-install,post-upgrade
      "helm.sh/hook-weight": "-5"
      "helm.sh/hook-delete-policy": before-hook-creation
    activeDeadlineSeconds: 900
    initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL at db-postgresql:5432..."
            until nc -z -v -w 2 db-postgresql 5432; do
              echo "Waiting for DB..."
              sleep 2;
            done
            echo "PostgreSQL is up!"

  setupJob:
    annotations:
      "helm.sh/hook": post-install,post-upgrade
      "helm.sh/hook-weight": "5"
      "helm.sh/hook-delete-policy": before-hook-creation
    activeDeadlineSeconds: 900
    initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL at db-postgresql:5432..."
            until nc -z -v -w 2 db-postgresql 5432; do
              echo "Waiting for DB..."
              sleep 2;
            done
            echo "PostgreSQL is up!"

# O-Auth2 Proxy
oauth2-proxy:
  enabled: true
  config:
    clientID: "348868471498539436"
    clientSecret: "VQMve4Thh857uplEKmN5nlcgSedaGyYQySSDYyoMgfk4d1PS8k6zUDSdhOdo3IVW"
    cookieSecret: "VcZnfAWYCgMfNjRLvM1byUaAUs2jSvSE" # Must be 32 characters

  service:
    portNumber: 80

  extraArgs:
    skip-provider-button: "true"
    http-address: "0.0.0.0:4180"
    cookie-secure: "false"
    cookie-domain: ".srdp.localhost"
    whitelist-domain: ".srdp.localhost"
    cookie-samesite: "lax"
    cookie-expire: "168h"
    provider: "oidc"
    provider-display-name: "ZITADEL"
    oidc-issuer-url: "https://auth.srdp.localhost"
    insecure-oidc-skip-issuer-verification: "true"
    ssl-insecure-skip-verify: "true"
    email-domain: "*"
    upstream: "file:///dev/null"
    reverse-proxy: "true"

  customRequestHeaders:
    - "Host:auth.srdp.localhost"
    - "X-Forwarded-Proto:https"

  # ip is a placeholder, overwritten by `just local-deploy`'s second pass
  # once Traefik's actual (dynamically-assigned) ClusterIP is known. It must
  # be syntactically valid but is never meant to resolve anything itself,
  # see the comment on traefik.service.spec above.
  hostAliases:
    - ip: "127.0.0.1"
      hostnames:
        - "auth.srdp.localhost"

# Dagster orchestration
dagster:
  enabled: true
  # Deploys an additional webserver in --read-only mode; the exposed ingress
  # routes to it and the read-write webserver stays cluster-internal for
  # operators (port-forward). Dagster OSS has no per-user authorization, so
  # an exposed read-write UI would bypass the writer role (see ADR-0005).
  dagsterWebserver:
    enableReadOnly: true
  ingress:
    enabled: false
  postgresql:
    enabled: false
    postgresqlHost: db-postgresql
    postgresqlUsername: dagster
    postgresqlPassword: srdpTest123
    postgresqlDatabase: dagster
    service:
      port: 5432
  runLauncher:
    type: K8sRunLauncher
    config:
      k8sRunLauncher:
        loadInclusterConfig: true
        imagePullPolicy: IfNotPresent
  dagster-user-deployments:
    enabled: true
    enableSubchart: true
    deployments:
      - name: srdp-etl
        image:
          repository: rg.nl-ams.scw.cloud/srdp-registry/srdp-etl
          tag: "v1.0"
          pullPolicy: IfNotPresent
        dagsterApiGrpcArgs:
          - "-m"
          - "etl.definitions"
        port: 3030
        env:
          - name: DUCKLAKE_PG_HOST
            value: db-postgresql
          - name: DUCKLAKE_PG_USER
            value: postgres
          - name: DUCKLAKE_PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-postgresql
                key: postgres-password
          - name: DUCKLAKE_PG_DB
            value: ducklake

# Marimo app
marimo:
  enabled: true
  image:
    repository: rg.nl-ams.scw.cloud/srdp-registry/marimo
    tag: "v1.0"
    pullPolicy: IfNotPresent

# Quarto app
# Disabled by default: heavy build (Pandoc/TinyTeX/Deno toolchain) for no
# current use. Flip to true to bring it back, the template stays in place.
quarto:
  enabled: false
  image:
    repository: rg.nl-ams.scw.cloud/srdp-registry/quarto
    tag: "v1.0"
    pullPolicy: IfNotPresent

# SRDP API (core routes + cbs-example's income-ingest router)
api:
  enabled: true
  image:
    repository: rg.nl-ams.scw.cloud/srdp-registry/srdp-api
    tag: "v1.0"
    pullPolicy: IfNotPresent

# DuckDB UI, reverse-proxied through Traefik (see services/duckdb-ui and
# projects/cbs-example/README.md for why it needs the internal route below)
duckdbUi:
  enabled: true
  image:
    repository: rg.nl-ams.scw.cloud/srdp-registry/duckdb-ui
    tag: "v1.0"
    pullPolicy: IfNotPresent

# Static hub landing page, served on the bare domain
hub:
  enabled: true
  image:
    repository: rg.nl-ams.scw.cloud/srdp-registry/hub
    tag: "v1.0"
    pullPolicy: IfNotPresent

# Marquez (OpenLineage backend + UI); upstream images, not built by this repo
marquez:
  enabled: true
  image:
    repository: marquezproject/marquez
    tag: "latest"
    pullPolicy: IfNotPresent
  web:
    image:
      repository: marquezproject/marquez-web
      tag: "latest"
      pullPolicy: IfNotPresent
