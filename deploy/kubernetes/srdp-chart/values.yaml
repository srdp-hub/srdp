# Global settings
global:
  domain: "srdp.localhost"
  # Differs in production (db-postgresql-primary), see values-prod.example.yaml.
  postgresqlHost: "db-postgresql"
  # Registry prefix for every image this repo builds (templates/_helpers.tpl
  # srdp.image). The source is srdp.toml [deploy].registry: the Justfile
  # deploy recipes override this value and the Dagster code location
  # repository below, a subchart value the chart cannot template. This
  # default must match srdp.toml, tests/deploy checks it.
  srdpRegistry: "rg.nl-ams.scw.cloud/srdp-registry"
  # Registry of the platform images SRDP publishes (srdp-setup, dagster-webserver,
  # duckdb-ui, hub). Images marked `platform: true` come from here.
  platformRegistry: "ghcr.io/srdp-hub"
  # Tag of every image this repo builds. Empty means the chart's appVersion,
  # which is the SRDP release. Local development sets "dev".
  imageTag: ""
  # Pod-level pull secrets for those images, e.g. [{name: registry-key}].
  imagePullSecrets: []

# Credentials: none live in this file. Every password and key comes from a
# Secret with a fixed name, created outside the chart (External Secrets in the
# cloud, templates/local-secrets.yaml in kind):
#   srdp-postgres            postgres-password, password (zitadel user),
#                            replication-password (replication only)
#   srdp-zitadel             masterkey, config-yaml
#   srdp-oauth2-proxy        client-id, client-secret, cookie-secret
#   srdp-dagster-postgresql  postgresql-password
#   srdp-marquez             db-password
localSecrets:
  enabled: false

# Traefik
traefik:
  enabled: true
  service:
    spec: {}
  # clusterIP is intentionally not pinned here: it must fall inside the
  # cluster's actual service CIDR, which varies by cluster (kind/Docker
  # Desktop default to 10.96.0.0/12, k3s to 10.43.0.0/16, ...). Kubernetes
  # assigns one dynamically; `just local-deploy` reads it back and feeds it
  # into oauth2-proxy.hostAliases below in a second pass.
  ports:
    web:
      nodePort: 30080
    websecure:
      nodePort: 30443
  # Same version as Compose, tests/deploy checks. Third-party images in
  # subcharts without a digest field are pinned by exact tag.
  image:
    tag: "v3.6.2"

# Local PostgreSQL
zitadel-db:
  enabled: true
  fullnameOverride: "db-postgresql"
  auth:
    database: zitadel
    username: zitadel
    existingSecret: srdp-postgres
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
      replicationPasswordKey: replication-password
  # Bitnami publishes only `latest`, so these are pinned by digest. This
  # one is PostgreSQL 18.6.0, the same major as Compose.
  image:
    repository: bitnami/postgresql
    digest: sha256:ea7edc281ba9f65e6af5cabbd1ade6e1a32ff473aa79395c2ffd8d6aff8b2036
  metrics:
    image:
      repository: bitnami/postgres-exporter
      digest: sha256:31efbed2026b64817b7f2ec54d6b2ec18e007e6229666320e0a45d66134d7ee7
  primary:
    # Bitnami's default resourcesPreset ("nano", 192Mi limit) gets the
    # primary OOMKilled once four databases and their clients connect.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    persistence:
      enabled: true
      size: 4Gi
  volumePermissions:
    enabled: true
    image:
      repository: bitnami/os-shell
      digest: sha256:c596a0cd6054322dc6ff09f192cfd3d3b619bbe649444c2522340d3739108b3d
  tls:
    enabled: true
    certificatesSecret: postgres-cert
    certFilename: "tls.crt"
    certKeyFilename: "tls.key"
  backup:
    enabled: true
    cronjob:
      schedule: "0 2 * * *"
      storage:
        size: 8Gi
        resourcePolicy: "keep"

# Zitadel auth service
zitadel:
  enabled: true
  zitadel:
    # masterkey (32 characters) and config-yaml, which holds the database
    # passwords and the first admin's password, merged with configmapConfig.
    masterkeySecretName: srdp-zitadel
    configSecretName: srdp-zitadel
    configSecretKey: config-yaml
    configmapConfig:
      ExternalDomain: auth.srdp.localhost
      ExternalPort: 443
      TLS:
        Enabled: false
      FirstInstance:
        Org:
          Human:
            PasswordChangeRequired: false
      Database:
        Postgres:
          Host: db-postgresql
          Port: 5432
          Database: zitadel
          User:
            Username: zitadel
            SSL:
              Mode: verify-full
          Admin:
            Username: postgres
            SSL:
              Mode: verify-full
    dbSslCaCrtSecret: postgres-cert
    dbSslAdminCrtSecret: postgres-cert
    dbSslUserCrtSecret: zitadel-cert
  image:
    tag: "v4.11.1"

  ingress:
    enabled: false

  login:
    enabled: true
    ingress:
      enabled: false
    image:
      tag: "v4.11.1"

  initJob:
    annotations:
      "helm.sh/hook": post-install,post-upgrade
      "helm.sh/hook-weight": "-5"
      "helm.sh/hook-delete-policy": before-hook-creation
    activeDeadlineSeconds: 900
    initContainers:
      - name: wait-for-db
        image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL at db-postgresql:5432..."
            until nc -z -v -w 2 db-postgresql 5432; do
              echo "Waiting for DB..."
              sleep 2;
            done
            echo "PostgreSQL is up!"

  setupJob:
    annotations:
      "helm.sh/hook": post-install,post-upgrade
      "helm.sh/hook-weight": "5"
      "helm.sh/hook-delete-policy": before-hook-creation
    activeDeadlineSeconds: 900
    initContainers:
      - name: wait-for-db
        image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL at db-postgresql:5432..."
            until nc -z -v -w 2 db-postgresql 5432; do
              echo "Waiting for DB..."
              sleep 2;
            done
            echo "PostgreSQL is up!"

# O-Auth2 Proxy
oauth2-proxy:
  enabled: true
  config:
    # client-id, client-secret and cookie-secret (32 characters).
    existingSecret: srdp-oauth2-proxy

  service:
    portNumber: 80

  extraArgs:
    skip-provider-button: "true"
    http-address: "0.0.0.0:4180"
    cookie-secure: "false"
    cookie-domain: ".srdp.localhost"
    whitelist-domain: ".srdp.localhost"
    cookie-samesite: "lax"
    cookie-expire: "168h"
    provider: "oidc"
    provider-display-name: "ZITADEL"
    oidc-issuer-url: "https://auth.srdp.localhost"
    insecure-oidc-skip-issuer-verification: "true"
    ssl-insecure-skip-verify: "true"
    email-domain: "*"
    upstream: "file:///dev/null"
    reverse-proxy: "true"

  customRequestHeaders:
    - "Host:auth.srdp.localhost"
    - "X-Forwarded-Proto:https"

  # ip is a placeholder, overwritten by `just local-deploy`'s second pass
  # once Traefik's actual (dynamically-assigned) ClusterIP is known. It must
  # be syntactically valid but is never meant to resolve anything itself,
  # see the comment on traefik.service.spec above.
  hostAliases:
    - ip: "127.0.0.1"
      hostnames:
        - "auth.srdp.localhost"

  image:
    tag: "v7.13.0"

# Dagster orchestration
dagster:
  enabled: true
  # Deploys an additional webserver in --read-only mode; the exposed ingress
  # routes to it and the read-write webserver stays cluster-internal for
  # operators (port-forward). Dagster OSS has no per-user authorization, so
  # an exposed read-write UI would bypass the writer role (see ADR-0005).
  # The password comes from srdp-dagster-postgresql (key postgresql-password),
  # for the webserver, daemon, code location and run pods alike.
  global:
    postgresqlSecretName: srdp-dagster-postgresql
  generatePostgresqlPasswordSecret: false
  # The webserver and daemon run SRDP's own dagster-webserver image, built from
  # uv.lock like Compose's, so Dagster and Python match the code location.
  # The tag is the chart's appVersion (a test checks), the Justfile moves the
  # repository with the platform registry like the code location's.
  dagsterWebserver:
    image:
      repository: ghcr.io/srdp-hub/dagster-webserver
      tag: "0.3.1" # release-tag
      pullPolicy: IfNotPresent
    enableReadOnly: true
    extraPrependedInitContainers: &wait-for-dagster-db
      # Copy of srdp.waitForDbLogin (_helpers.tpl), the subchart doesn't tpl this.
      - name: wait-for-dagster-db
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        command:
          - sh
          - -c
          - |
            for i in $(seq 1 60); do
              psql -tAc "SELECT 1" >/dev/null && exit 0
              echo "waiting for $PGUSER to log in to $PGDATABASE ($i/60)..."
              sleep 2
            done
            exit 1
        securityContext:
          runAsNonRoot: true
          runAsUser: 70
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        env:
          - name: PGHOST
            value: db-postgresql
          - name: PGUSER
            value: dagster
          - name: PGDATABASE
            value: dagster
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: srdp-dagster-postgresql
                key: postgresql-password
  ingress:
    enabled: false
  postgresql:
    enabled: false
    # Image of the subchart's own check-db-ready init container, the same
    # pinned postgres image as the wait containers (no digest field, so the
    # digest rides on the tag).
    image:
      repository: library/postgres
      tag: "18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873"
    postgresqlHost: db-postgresql
    postgresqlUsername: dagster
    postgresqlDatabase: dagster
    service:
      port: 5432
  # The subchart's own busybox version, pinned. Its init containers wait
  # with nslookup, which hung on 1.36.1 in kind (NXDOMAIN on search domains).
  busybox:
    image:
      repository: docker.io/busybox
      tag: "1.28.4@sha256:141c253bc4c3fd0a201d32dc1f493bcf3fff003b6df416dea4f41046e0f37d47"
  # DuckLake handles concurrent writers through its Postgres catalog, so runs
  # can overlap. The cap protects node memory (each run pod may take 1536Mi,
  # a backfill 2Gi) and Postgres connections, and the queue is what applies
  # dagster/priority for the fast lane. Same limits as Compose's
  # config/dagster/dagster.yaml, a test checks.
  dagsterDaemon:
    image:
      repository: ghcr.io/srdp-hub/dagster-webserver
      tag: "0.3.1" # release-tag
      pullPolicy: IfNotPresent
    extraPrependedInitContainers: *wait-for-dagster-db
    runCoordinator:
      enabled: true
      type: QueuedRunCoordinator
      config:
        queuedRunCoordinator:
          maxConcurrentRuns: 3
          tagConcurrencyLimits:
            - key: workload_kind
              value: backfill
              limit: 1
  runLauncher:
    type: K8sRunLauncher
    config:
      k8sRunLauncher:
        loadInclusterConfig: true
        imagePullPolicy: IfNotPresent
  dagster-user-deployments:
    enabled: true
    enableSubchart: true
    deployments:
      - name: srdp-etl
        image:
          # <srdp.toml [deploy].registry>/srdp-etl, the Justfile overrides it.
          repository: rg.nl-ams.scw.cloud/srdp-registry/srdp-etl
          # The chart's appVersion, a test checks. The release script keeps it.
          tag: "0.3.1" # release-tag
          pullPolicy: IfNotPresent
        dagsterApiGrpcArgs:
          - "-m"
          - "etl.definitions"
        port: 3030
        initContainers:
          - name: wait-for-ducklake-db
            image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
            command:
              - sh
              - -c
              - |
                for i in $(seq 1 60); do
                  psql -tAc "SELECT 1" >/dev/null && exit 0
                  echo "waiting for $PGUSER to log in to $PGDATABASE ($i/60)..."
                  sleep 2
                done
                exit 1
            securityContext:
              runAsNonRoot: true
              runAsUser: 70
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            env:
              - name: PGHOST
                value: db-postgresql
              - name: PGUSER
                value: postgres
              - name: PGDATABASE
                value: ducklake
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: srdp-postgres
                    key: postgres-password
        # Writer side of the shared DuckLake volume (templates/ducklake-data-pvc.yaml).
        # includeConfigInLaunchedRuns (on by default) copies env and volumes
        # into every K8sRunLauncher run pod, which is where assets materialize.
        volumes:
          - name: ducklake-data
            persistentVolumeClaim:
              claimName: ducklake-data
        volumeMounts:
          - name: ducklake-data
            mountPath: /data/ducklake
        env:
          - name: DUCKLAKE_PG_HOST
            value: db-postgresql
          - name: DUCKLAKE_PG_USER
            value: postgres
          - name: DUCKLAKE_PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: srdp-postgres
                key: postgres-password
          - name: DUCKLAKE_PG_DB
            value: ducklake
          - name: DUCKLAKE_DATA_PATH
            value: /data/ducklake

# Marimo app
marimo:
  enabled: true
  image:
    repository: marimo
    pullPolicy: IfNotPresent

# Streamlit dashboard (projects/cbs-example/streamlit)
streamlit:
  enabled: true
  image:
    repository: streamlit
    pullPolicy: IfNotPresent

# Shared DuckLake data volume, see templates/ducklake-data-pvc.yaml
ducklakeData:
  mountPath: /data/ducklake
  size: 4Gi
  accessMode: ReadWriteOnce
  storageClassName: ""

# Quarto app
# Disabled by default: heavy build (Pandoc/TinyTeX/Deno toolchain) for no
# current use. Flip to true to bring it back, the template stays in place.
quarto:
  enabled: false
  image:
    repository: quarto
    pullPolicy: IfNotPresent

# Setup: database/role bootstrap Job
setup:
  # When disabled, the databases must exist already, consumers wait for them.
  enabled: true
  image:
    repository: srdp-setup
    platform: true
    pullPolicy: IfNotPresent
  # Keep in step with srdp.toml [setup]. A new role needs its SETUP_PASSWORDS__<ROLE> on the Job.
  databases:
    # Owned by the zitadel-db subchart's auth.* fields instead, a second
    # source for the same role could silently diverge. #78 moves it into
    # srdp-setup, like every other database.
    - name: zitadel
      role: zitadel
      enabled: false
    - name: dagster
      role: dagster
    - name: marquez
      role: marquez
    # DuckLake connects as the superuser (DUCKLAKE_PG_USER=postgres).
    - name: ducklake

# SRDP API (core routes + cbs-example's income-ingest router)
api:
  enabled: true
  image:
    repository: srdp-api
    pullPolicy: IfNotPresent

# DuckDB UI, reverse-proxied through Traefik (see services/duckdb-ui and
# projects/cbs-example/README.md for why it needs the internal route below)
duckdbUi:
  enabled: true
  image:
    repository: duckdb-ui
    platform: true
    pullPolicy: IfNotPresent

# Static hub landing page, served on the bare domain
hub:
  enabled: true
  image:
    repository: hub
    platform: true
    pullPolicy: IfNotPresent

# Marquez (OpenLineage backend + UI); upstream images, not built by this repo
marquez:
  enabled: true
  # Database password from srdp-marquez (key db-password), shared with the
  # srdp-setup Job.
  image:
    repository: marquezproject/marquez
    tag: "0.51.1"
    digest: sha256:0721c976cff17d8b14f7949d85d6dac9c7ea37cb9fe857caa19833730fcb1a50
    pullPolicy: IfNotPresent
  web:
    image:
      repository: marquezproject/marquez-web
      tag: "0.51.1"
      digest: sha256:7312112ca0e611b0a37b00d3da6a677485ae4a97622b23d3ae24d849a927868b
      pullPolicy: IfNotPresent
