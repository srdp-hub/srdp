traefik:
  service:
    type: LoadBalancer
  # ports.*.nodePort is inherited from values.yaml (30080/30443, fixed so
  # kind-config.yaml's host port mapping has something stable to point at).
  tlsStore:
    default:
      defaultCertificate:
        secretName: custom-ingress-cert

# Development credentials for kind, rendered into Secrets by
# templates/local-secrets.yaml. Never reuse them outside a local cluster.
localSecrets:
  enabled: true
  postgres:
    postgresPassword: srdpTest123
    zitadelPassword: srdpTest123
  zitadel:
    masterkey: "51a69a373f45c60d2ae08c48bb89d03e" # Must be 32 chars
    adminPassword: "srdpTest123!"
  oauth2Proxy:
    clientID: "362914460869919313"
    clientSecret: "6wdizcEbBnztdVvVoFwbSzHBfWYdBJshIOP6VlsxrDe5c1zSUQMvgDa6PfnA24BT"
    cookieSecret: "VcZnfAWYCgMfNjRLvM1byUaAUs2jSvSE" # Must be 32 chars
  dagster:
    dbPassword: srdpTest123
  marquez:
    dbPassword: srdpTest123
  # DuckLake on S3 against the bundled Garage (values-local-s3.yaml). Garage
  # wants a key id of GK plus 24 hex characters and a 64-hex-character secret.
  ducklakeS3:
    writer:
      keyId: GK000000000000000000000001
      secret: "1111111111111111111111111111111111111111111111111111111111111111"
    reader:
      keyId: GK000000000000000000000002
      secret: "2222222222222222222222222222222222222222222222222222222222222222"
  garage:
    rpcSecret: "3333333333333333333333333333333333333333333333333333333333333333" # 64 hex characters
    adminToken: srdpLocalGarageAdmin

zitadel-db:
  primary:
    # Local Docker Desktop can be noisy; relax probes to avoid unnecessary restarts.
    livenessProbe:
      enabled: true
      initialDelaySeconds: 120
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 12
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 12

zitadel:
  # Source: https://github.com/zitadel/zitadel/issues/11163
  login:
    customConfigmapConfig: |
      ZITADEL_SERVICE_USER_TOKEN_FILE="/login-client/pat"
      ZITADEL_API_URL="http://srdp-zitadel:8080"
      CUSTOM_REQUEST_HEADERS="Host:auth.srdp.localhost,X-Zitadel-Public-Host:auth.srdp.localhost"

# Local overrides: use locally-built images (no registry pull)
marimo:
  image:
    pullPolicy: Never

quarto:
  image:
    pullPolicy: Never

dagster:
  dagster-user-deployments:
    deployments:
      - name: srdp-etl
        image:
          repository: rg.nl-ams.scw.cloud/srdp-registry/srdp-etl
          tag: "v1.0"
          pullPolicy: Never
        dagsterApiGrpcArgs: ["-m", "etl.definitions"]
        port: 3030
        initContainers:
          - name: wait-for-ducklake-db
            image: postgres:17-alpine
            command:
              - sh
              - -c
              - |
                for i in $(seq 1 60); do
                  psql -tAc "SELECT 1" >/dev/null && exit 0
                  echo "waiting for $PGUSER to log in to $PGDATABASE ($i/60)..."
                  sleep 2
                done
                exit 1
            securityContext:
              runAsNonRoot: true
              runAsUser: 70
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            env:
              - name: PGHOST
                value: db-postgresql
              - name: PGUSER
                value: postgres
              - name: PGDATABASE
                value: ducklake
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: srdp-postgres
                    key: postgres-password
          - name: wait-for-ducklake-bucket
            # Same container as srdp.waitForDucklakeBucket in templates/_helpers.tpl,
            # with the writer key. includeConfigInLaunchedRuns copies it into
            # every run pod, so no run starts before the bucket exists.
            image: curlimages/curl:8.22.0
            securityContext:
              runAsNonRoot: true
              runAsUser: 100
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            envFrom:
              - configMapRef:
                  name: srdp-ducklake-storage
            env:
              - name: DUCKLAKE_S3_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: srdp-ducklake-s3-writer
                    key: DUCKLAKE_S3_KEY_ID
                    optional: true
              - name: DUCKLAKE_S3_SECRET
                valueFrom:
                  secretKeyRef:
                    name: srdp-ducklake-s3-writer
                    key: DUCKLAKE_S3_SECRET
                    optional: true
            command:
              - sh
              - -c
              - |
                if [ "$DUCKLAKE_STORAGE_BACKEND" != "s3" ]; then exit 0; fi
                scheme=https
                if [ "$DUCKLAKE_S3_USE_SSL" = "false" ]; then scheme=http; fi
                # The list request DuckDB makes on s3://<bucket>/<prefix>/, in its URL style,
                # so a key scoped to the prefix passes too. The chart allows only
                # [A-Za-z0-9._/-] in the prefix, so / is the one character to encode.
                prefix=$(printf '%s' "$DUCKLAKE_S3_PREFIX" | sed -e 's#^/*##' -e 's#/*$##')
                if [ -n "$prefix" ]; then prefix="$(printf '%s' "$prefix" | sed 's#/#%2F#g')%2F"; fi
                query="list-type=2&max-keys=1&prefix=$prefix"
                if [ "$DUCKLAKE_S3_URL_STYLE" = "vhost" ]; then
                  url="$scheme://$DUCKLAKE_S3_BUCKET.$DUCKLAKE_S3_ENDPOINT/?$query"
                else
                  url="$scheme://$DUCKLAKE_S3_ENDPOINT/$DUCKLAKE_S3_BUCKET?$query"
                fi
                for i in $(seq 1 60); do
                  # The key goes in through stdin, so it never shows in the process list.
                  code=$(printf 'user = "%s:%s"\n' "$DUCKLAKE_S3_KEY_ID" "$DUCKLAKE_S3_SECRET" |
                    curl -s -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 10 \
                        -K - --aws-sigv4 "aws:amz:$DUCKLAKE_S3_REGION:s3" "$url")
                  if [ "$code" = "200" ]; then exit 0; fi
                  echo "waiting for bucket $DUCKLAKE_S3_BUCKET at $DUCKLAKE_S3_ENDPOINT, HTTP $code ($i/60)..."
                  sleep 2
                done
                echo "bucket $DUCKLAKE_S3_BUCKET still unreachable with this pod's key after 60 attempts, giving up." >&2
                exit 1
        # Writer side of the shared DuckLake volume (templates/ducklake-data-pvc.yaml).
        # includeConfigInLaunchedRuns (on by default) copies env and volumes
        # into every K8sRunLauncher run pod, which is where assets materialize.
        volumes:
          - name: ducklake-data
            persistentVolumeClaim:
              claimName: ducklake-data
        volumeMounts:
          - name: ducklake-data
            mountPath: /data/ducklake
        # DUCKLAKE_STORAGE_BACKEND and the S3 settings, see ducklakeStorage.
        envConfigMaps:
          - name: srdp-ducklake-storage
        env:
          - name: DUCKLAKE_PG_HOST
            value: db-postgresql
          - name: DUCKLAKE_PG_USER
            value: postgres
          - name: DUCKLAKE_PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: srdp-postgres
                key: postgres-password
          - name: DUCKLAKE_PG_DB
            value: ducklake
          - name: DUCKLAKE_DATA_PATH
            value: /data/ducklake
          # The writer key, for DUCKLAKE_STORAGE_BACKEND=s3. Optional, so
          # local storage needs no such Secret. Only this code location and
          # its run pods hold it, the apps get the read-only key.
          - name: DUCKLAKE_S3_KEY_ID
            valueFrom:
              secretKeyRef:
                name: srdp-ducklake-s3-writer
                key: DUCKLAKE_S3_KEY_ID
                optional: true
          - name: DUCKLAKE_S3_SECRET
            valueFrom:
              secretKeyRef:
                name: srdp-ducklake-s3-writer
                key: DUCKLAKE_S3_SECRET
                optional: true
