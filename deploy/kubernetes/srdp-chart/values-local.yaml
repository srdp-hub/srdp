traefik:
  service:
    type: LoadBalancer
  # ports.*.nodePort is inherited from values.yaml (30080/30443, fixed so
  # kind-config.yaml's host port mapping has something stable to point at).
  tlsStore:
    default:
      defaultCertificate:
        secretName: custom-ingress-cert

# Development credentials for kind, rendered into Secrets by
# templates/local-secrets.yaml. Never reuse them outside a local cluster.
localSecrets:
  enabled: true
  postgres:
    postgresPassword: srdpTest123
    zitadelPassword: srdpTest123
  zitadel:
    masterkey: "51a69a373f45c60d2ae08c48bb89d03e" # Must be 32 chars
    adminPassword: "srdpTest123!"
  oauth2Proxy:
    clientID: "362914460869919313"
    clientSecret: "6wdizcEbBnztdVvVoFwbSzHBfWYdBJshIOP6VlsxrDe5c1zSUQMvgDa6PfnA24BT"
    cookieSecret: "VcZnfAWYCgMfNjRLvM1byUaAUs2jSvSE" # Must be 32 chars
  dagster:
    dbPassword: srdpTest123
  marquez:
    dbPassword: srdpTest123

zitadel-db:
  primary:
    # Local Docker Desktop can be noisy; relax probes to avoid unnecessary restarts.
    livenessProbe:
      enabled: true
      initialDelaySeconds: 120
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 12
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 12

zitadel:
  # Source: https://github.com/zitadel/zitadel/issues/11163
  login:
    customConfigmapConfig: |
      ZITADEL_SERVICE_USER_TOKEN_FILE="/login-client/pat"
      ZITADEL_API_URL="http://srdp-zitadel:8080"
      CUSTOM_REQUEST_HEADERS="Host:auth.srdp.localhost,X-Zitadel-Public-Host:auth.srdp.localhost"

# Local overrides: use locally-built images (no registry pull), tagged dev.
global:
  imageTag: "dev"

marimo:
  image:
    pullPolicy: Never

quarto:
  image:
    pullPolicy: Never

streamlit:
  image:
    pullPolicy: Never

setup:
  image:
    pullPolicy: Never

api:
  image:
    pullPolicy: Never

duckdbUi:
  image:
    pullPolicy: Never

hub:
  image:
    pullPolicy: Never

dagster:
  dagsterWebserver:
    image:
      tag: "dev"
      pullPolicy: Never
    # Dev only, see the OPENSSL_armcap note in docker-compose.override.yml.
    env: &openssl-armcap
      - name: OPENSSL_armcap
        value: "0"
  dagsterDaemon:
    image:
      tag: "dev"
      pullPolicy: Never
    # Dev only, see the OPENSSL_armcap note in docker-compose.override.yml.
    env: *openssl-armcap
  runLauncher:
    config:
      k8sRunLauncher:
        envVars:
          - OPENSSL_armcap=0
  dagster-user-deployments:
    deployments:
      - name: srdp-etl
        image:
          repository: rg.nl-ams.scw.cloud/srdp-registry/srdp-etl
          tag: "dev"
          pullPolicy: Never
        dagsterApiGrpcArgs: ["-m", "etl.definitions"]
        port: 3030
        env: *openssl-armcap
        initContainers:
          - name: wait-for-ducklake-db
            image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
            command:
              - sh
              - -c
              - |
                for i in $(seq 1 60); do
                  psql -tAc "SELECT 1" >/dev/null && exit 0
                  echo "waiting for $PGUSER to log in to $PGDATABASE ($i/60)..."
                  sleep 2
                done
                exit 1
            securityContext:
              runAsNonRoot: true
              runAsUser: 70
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            env:
              - name: PGHOST
                value: db-postgresql
              - name: PGUSER
                value: postgres
              - name: PGDATABASE
                value: ducklake
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: srdp-postgres
                    key: postgres-password
        # Writer side of the shared DuckLake volume (templates/ducklake-data-pvc.yaml).
        # includeConfigInLaunchedRuns (on by default) copies env and volumes
        # into every K8sRunLauncher run pod, which is where assets materialize.
        volumes:
          - name: ducklake-data
            persistentVolumeClaim:
              claimName: ducklake-data
        volumeMounts:
          - name: ducklake-data
            mountPath: /data/ducklake
        env:
          - name: DUCKLAKE_PG_HOST
            value: db-postgresql
          - name: DUCKLAKE_PG_USER
            value: postgres
          - name: DUCKLAKE_PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: srdp-postgres
                key: postgres-password
          - name: DUCKLAKE_PG_DB
            value: ducklake
          - name: DUCKLAKE_DATA_PATH
            value: /data/ducklake
