services:
  # ---------------------------------------------
  # Shared PostgreSQL
  # ---------------------------------------------
  postgres:
    restart: always
    image: postgres:17-alpine
    container_name: srdp-postgres
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      # Read by initdb/01-create-databases.sh on first boot only, to create the
      # zitadel/dagster roles without a literal password committed there.
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: "${ZITADEL_DATABASE_POSTGRES_USER_PASSWORD}"
      DAGSTER_PG_PASSWORD: "${DAGSTER_PG_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 60s
      retries: 10
      start_period: 5s
    networks:
      - db
    volumes:
      - pgdata:/var/lib/postgresql/data:rw
      - ./initdb:/docker-entrypoint-initdb.d:ro

  # ---------------------------------------------
  # Reverse Proxy
  # ---------------------------------------------
  traefik:
    image: traefik:v3.5.3
    container_name: srdp-traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=srdp-app"
    volumes:
      - "../../config/traefik/traefik.yml:/etc/traefik/traefik.yaml:ro"
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      app:
        aliases:
          - auth.srdp.localhost
    depends_on:
      zitadel:
        condition: service_healthy

  # ---------------------------------------------
  # Identity & Auth (Zitadel)
  # ---------------------------------------------
  zitadel:
    extends:
      service: zitadel-init
    container_name: srdp-zitadel
    command: 'start-from-setup --masterkey "${ZITADEL_MASTERKEY}"'
    environment:
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: true
      ZITADEL_TLS_ENABLED: true
      ZITADEL_TLS_CERTPATH: /etc/certs/selfsigned.crt
      ZITADEL_TLS_KEYPATH: /etc/certs/selfsigned.key
    volumes:
      - ./certs/selfsigned.crt:/etc/certs/selfsigned.crt
      - ./certs/selfsigned.key:/etc/certs/selfsigned.key
      - '.:/current-dir:rw'
    networks:
      - app
      - db
    depends_on:
      zitadel-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  zitadel-init:
    image: '${ZITADEL_IMAGE:-ghcr.io/zitadel/zitadel:v4.2.2}'
    container_name: srdp-zitadel-init
    command: init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZITADEL_EXTERNALDOMAIN: auth.srdp.localhost
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: true
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD}"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: "${ZITADEL_DATABASE_POSTGRES_USER_PASSWORD}"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /current-dir/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: '2029-01-01T00:00:00Z'
    networks:
      - db
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - '.:/current-dir:rw'

  zitadel-login:
    restart: unless-stopped
    image: 'ghcr.io/zitadel/zitadel-login:v4.2.2'
    container_name: srdp-zitadel-login
    environment:
      - ZITADEL_API_URL=https://zitadel:8080
      - NEXT_PUBLIC_BASE_PATH=/ui/v2/login
      - ZITADEL_SERVICE_USER_TOKEN_FILE=/current-dir/login-client.pat
      - CUSTOM_REQUEST_HEADERS=Host:auth.srdp.localhost
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - '.:/current-dir:ro'
    networks:
      - app
    depends_on:
      zitadel:
        condition: service_healthy

  # ---------------------------------------------
  # Authentication Proxy
  # ---------------------------------------------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: srdp-oauth2-proxy
    restart: unless-stopped
    networks:
      - app
    command:
      - --upstream=file:///dev/null
      - --provider=oidc
      - --http-address=0.0.0.0:4180
      - --email-domain=*
      - --reverse-proxy=true
      - --pass-host-header=true
      - --proxy-prefix=/oauth2
      - --whitelist-domain=.srdp.localhost
      - --set-xauthrequest=true
      - --provider-display-name=ZITADEL
      - --oidc-issuer-url=https://auth.srdp.localhost
      - --insecure-oidc-skip-issuer-verification=true
      - --ssl-insecure-skip-verify
      - --skip-provider-button
      - --cookie-name=_oauth2_proxy
      - --cookie-domain=.srdp.localhost
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --pass-authorization-header=false
      - --pass-access-token=true
      # Lets a request that already carries a valid Bearer token (e.g. the
      # access token this same session hands the user via /token) skip the
      # cookie/redirect flow entirely, for calling the API outside a browser.
      - --skip-jwt-bearer-tokens=true
      - --extra-jwt-issuers=https://auth.srdp.localhost=${OIDC_CLIENT_ID}
    environment:
      OAUTH2_PROXY_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OIDC_COOKIE_SECRET}"
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: true
      OAUTH2_PROXY_COOKIE_CSRF_EXPIRE: '5m'
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=srdp-app"
      - "traefik.http.routers.oauth2-proxy.rule=(Host(`auth.srdp.localhost`) || Host(`quarto.srdp.localhost`) || Host(`marimo.srdp.localhost`) || Host(`dagster.srdp.localhost`) || Host(`streamlit.srdp.localhost`) || Host(`srdp.localhost`) || Host(`marquez.srdp.localhost`) || Host(`api.srdp.localhost`) || Host(`duckdb.srdp.localhost`)) && PathPrefix(`/oauth2/`)"
      - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"
      - "traefik.http.middlewares.zitadel-auth.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth"
      - "traefik.http.middlewares.zitadel-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.zitadel-auth.forwardauth.authResponseHeaders=X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Access-Token"
      - "traefik.http.middlewares.zitadel-errors.errors.status=401,402,403"
      - "traefik.http.middlewares.zitadel-errors.errors.statusRewrites.401=302"
      - "traefik.http.middlewares.zitadel-errors.errors.service=oauth2-proxy@docker"
      - "traefik.http.middlewares.zitadel-errors.errors.query=/oauth2/sign_in"
    depends_on:
      traefik:
        condition: service_healthy
      zitadel:
        condition: service_healthy

  # ---------------------------------------------
  # Dagster (Orchestration)
  # ---------------------------------------------
  dagster-webserver:
    build:
      context: ../../
      dockerfile: deploy/docker/dagster-webserver.Dockerfile
    container_name: srdp-dagster-webserver
    environment:
      DAGSTER_HOME: /app/config/dagster
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_USER: dagster
      DAGSTER_PG_PASSWORD: "${DAGSTER_PG_PASSWORD}"
      DAGSTER_PG_DB: dagster
    networks:
      - app
      - db
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
    command:
      [
        "dagster-webserver",
        "-h", "0.0.0.0",
        "-p", "3000",
        "-w", "/app/config/dagster/workspace.yaml",
      ]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=srdp-app"
      - "traefik.http.routers.dagster.rule=Host(`dagster.srdp.localhost`)"
      - "traefik.http.routers.dagster.service=dagster@docker"
      - "traefik.http.services.dagster.loadbalancer.server.port=3000"
      - "traefik.http.routers.dagster.middlewares=zitadel-errors@docker,zitadel-auth@docker"

  dagster-daemon:
    build:
      context: ../../
      dockerfile: deploy/docker/dagster-webserver.Dockerfile
    container_name: srdp-dagster-daemon
    environment:
      DAGSTER_HOME: /app/config/dagster
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_USER: dagster
      DAGSTER_PG_PASSWORD: "${DAGSTER_PG_PASSWORD}"
      DAGSTER_PG_DB: dagster
    networks:
      - db
    volumes:
      - dagster-compute-logs:/app/compute_logs
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
    command: ["dagster-daemon", "run", "-w", "/app/config/dagster/workspace.yaml"]

  dagster-code:
    build:
      context: ../../
      dockerfile: projects/cbs-example/Dockerfile
    container_name: srdp-dagster-code
    environment:
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_USER: dagster
      DAGSTER_PG_PASSWORD: "${DAGSTER_PG_PASSWORD}"
      DAGSTER_PG_DB: dagster
      DAGSTER_CURRENT_IMAGE: srdp-dagster-code
      DUCKLAKE_PG_HOST: postgres
      DUCKLAKE_PG_USER: postgres
      DUCKLAKE_PG_PASSWORD: "${POSTGRES_PASSWORD}"
      DUCKLAKE_PG_DB: ducklake
      DUCKLAKE_DATA_PATH: /data/ducklake
      MARQUEZ_URL: http://marquez:5000
    healthcheck:
      test: ["CMD", "uv", "run", "dagster", "api", "grpc-health-check", "-p", "3030"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    networks:
      - db
    volumes:
      - ducklake-data:/data/ducklake
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "uv", "run", "dagster", "code-server", "start",
        "-h", "0.0.0.0",
        "-p", "3030",
        "-m", "etl.definitions",
      ]

  # ---------------------------------------------
  # Marimo App
  # ---------------------------------------------
  marimo:
    build:
      context: ../../
      dockerfile: projects/cbs-example/notebooks/Dockerfile
    container_name: srdp-marimo
    environment:
      DUCKLAKE_PG_HOST: postgres
      DUCKLAKE_PG_USER: postgres
      DUCKLAKE_PG_PASSWORD: "${POSTGRES_PASSWORD}"
      DUCKLAKE_PG_DB: ducklake
      DUCKLAKE_DATA_PATH: /data/ducklake
    networks:
      - app
      - db
    volumes:
      - ducklake-data:/data/ducklake:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=srdp-app"
      - "traefik.http.routers.marimo.rule=Host(`marimo.srdp.localhost`)"
      - "traefik.http.routers.marimo.service=marimo@docker"
      - "traefik.http.services.marimo.loadbalancer.server.port=8000"
      - "traefik.http.routers.marimo.middlewares=zitadel-errors@docker,zitadel-auth@docker"

  # ---------------------------------------------
  # Quarto Static Site
  # ---------------------------------------------
  # Off by default: its base image bundles a full Pandoc/TinyTeX/Deno toolchain
  # sized for scientific publishing, heavy for a single static page, and it has
  # crashed the local Docker daemon on memory-constrained dev VMs. Opt in with
  # `docker compose --profile optional up quarto` when actually needed.
  quarto:
    profiles: ["optional"]
    build:
      context: ../../services/quarto
      dockerfile: Dockerfile
    container_name: srdp-quarto
    networks:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=srdp-app"
      - "traefik.http.routers.quarto.rule=Host(`quarto.srdp.localhost`)"
      - "traefik.http.routers.quarto.service=quarto@docker"
      - "traefik.http.services.quarto.loadbalancer.server.port=80"
      - "traefik.http.routers.quarto.middlewares=zitadel-errors@docker,zitadel-auth@docker"

  # ---------------------------------------------
  # Streamlit Dashboard
  # ---------------------------------------------
  streamlit:
    build:
      context: ../../
      dockerfile: projects/cbs-example/streamlit/Dockerfile
    container_name: srdp-streamlit
    environment:
      DUCKLAKE_PG_HOST: postgres
      DUCKLAKE_PG_USER: postgres
      DUCKLAKE_PG_PASSWORD: "${POSTGRES_PASSWORD}"
      DUCKLAKE_PG_DB: ducklake
      DUCKLAKE_DATA_PATH: /data/ducklake
    networks:
      - app
      - db
    volumes:
      - ducklake-data:/data/ducklake:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=srdp-app"
      - "traefik.http.routers.streamlit.rule=Host(`streamlit.srdp.localhost`)"
      - "traefik.http.routers.streamlit.service=streamlit@docker"
      - "traefik.http.services.streamlit.loadbalancer.server.port=8000"
      - "traefik.http.routers.streamlit.middlewares=zitadel-errors@docker,zitadel-auth@docker"

  # ---------------------------------------------
  # FastAPI — basic read-only info on the catalog and Dagster
  # ---------------------------------------------
  api:
    build:
      context: ../../
      dockerfile: projects/cbs-example/api/Dockerfile
    container_name: srdp-api
    environment:
      DUCKLAKE_PG_HOST: postgres
      DUCKLAKE_PG_USER: postgres
      DUCKLAKE_PG_PASSWORD: "${POSTGRES_PASSWORD}"
      DUCKLAKE_PG_DB: ducklake
      DUCKLAKE_DATA_PATH: /data/ducklake
      DAGSTER_GRAPHQL_URL: http://dagster-webserver:3000/graphql
    networks:
      - app
      - db
    volumes:
      - ducklake-data:/data/ducklake:ro
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=srdp-app"
      - "traefik.http.routers.api.rule=Host(`api.srdp.localhost`)"
      - "traefik.http.routers.api.service=api@docker"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.routers.api.middlewares=zitadel-errors@docker,zitadel-auth@docker"

  # ---------------------------------------------
  # DuckDB UI — ad hoc queries against the DuckLake catalog
  # ---------------------------------------------
  duckdb-ui:
    build:
      context: ../../
      dockerfile: services/duckdb-ui/Dockerfile
    container_name: srdp-duckdb-ui
    environment:
      DUCKLAKE_PG_HOST: postgres
      DUCKLAKE_PG_USER: postgres
      DUCKLAKE_PG_PASSWORD: "${POSTGRES_PASSWORD}"
      DUCKLAKE_PG_DB: ducklake
      DUCKLAKE_DATA_PATH: /data/ducklake
    networks:
      - app
      - db
    volumes:
      - ducklake-data:/data/ducklake:ro
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=srdp-app"
      - "traefik.http.routers.duckdb-ui.rule=Host(`duckdb.srdp.localhost`)"
      - "traefik.http.routers.duckdb-ui.service=duckdb-ui@docker"
      - "traefik.http.services.duckdb-ui.loadbalancer.server.port=4213"
      - "traefik.http.routers.duckdb-ui.middlewares=zitadel-errors@docker,zitadel-auth@docker"
      # DuckDB UI's frontend makes its own background API calls (/localToken,
      # /ddb/run, /ddb/interrupt, /ddb/tokenize, /localEvents — all confirmed by
      # reading its own bundle) that can legitimately return their own 401 from
      # DuckDB's server, unrelated to SSO. zitadel-errors rewrites ANY 401 in the
      # response chain into a login redirect, which hijacks these and breaks them
      # with a CORS error a background fetch() can't follow. This more specific
      # router (Traefik favors the longer/more specific rule automatically, no
      # explicit priority needed) keeps the real auth check (zitadel-auth) but
      # skips the rewrite for DuckDB's own API surface. /localEvents is a
      # long-lived EventSource (SSE) stream, not request/response — see
      # haproxy.cfg's timeout tunnel for why that matters too.
      - "traefik.http.routers.duckdb-ui-internal.rule=Host(`duckdb.srdp.localhost`) && (Path(`/localToken`) || Path(`/localEvents`) || PathPrefix(`/ddb/`))"
      - "traefik.http.routers.duckdb-ui-internal.service=duckdb-ui@docker"
      - "traefik.http.routers.duckdb-ui-internal.middlewares=zitadel-auth@docker"

  # ---------------------------------------------
  # Marquez (OpenLineage backend + UI)
  # ---------------------------------------------
  marquez:
    image: marquezproject/marquez:latest
    container_name: srdp-marquez
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SEARCH_ENABLED: false
    networks:
      - app
      - db
    depends_on:
      postgres:
        condition: service_healthy

  marquez-web:
    image: marquezproject/marquez-web:latest
    container_name: srdp-marquez-web
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    networks:
      - app
    depends_on:
      - marquez
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=srdp-app"
      - "traefik.http.routers.marquez.rule=Host(`marquez.srdp.localhost`)"
      - "traefik.http.routers.marquez.service=marquez-web@docker"
      - "traefik.http.services.marquez-web.loadbalancer.server.port=3000"
      - "traefik.http.routers.marquez.middlewares=zitadel-errors@docker,zitadel-auth@docker"

  # ---------------------------------------------
  # Hub — static landing page linking the other services
  # ---------------------------------------------
  # Gated behind SSO like every other service, so who's landing on it is known too.
  # Plain nginx + static HTML, deliberately: no generator, no toolchain, nothing to
  # crash — see the Quarto service above for what happens when that's skipped.
  hub:
    build:
      context: ../../services/hub
      dockerfile: Dockerfile
    container_name: srdp-hub
    networks:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=srdp-app"
      - "traefik.http.routers.hub.rule=Host(`srdp.localhost`)"
      - "traefik.http.routers.hub.service=hub@docker"
      - "traefik.http.services.hub.loadbalancer.server.port=80"
      - "traefik.http.routers.hub.middlewares=zitadel-errors@docker,zitadel-auth@docker"

networks:
  app:
    name: srdp-app
  db:
    name: srdp-db

volumes:
  pgdata:
    name: srdp-pgdata
  dagster-compute-logs:
    name: srdp-dagster-compute-logs
  ducklake-data:
    name: srdp-ducklake-data
