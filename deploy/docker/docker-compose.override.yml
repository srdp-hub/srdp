services:
  traefik:
    # Local development only. A production run lists its files explicitly
    # (-f docker-compose.yml -f docker-compose.prod.yml), so Compose skips this
    # file and none of the below reaches production.
    # The mkcert key is mode 0600 and owned by the developer, so Traefik runs as
    # that user here. just docker-up sets SRDP_UID and SRDP_GID.
    user: "${SRDP_UID:-65532}:${SRDP_GID:-65532}"
    ports:
      # Traefik dashboard (api.insecure in config/traefik/traefik.yml).
      - "8080:8080"
    volumes:
      - "./certs/selfsigned.crt:/etc/certs/selfsigned.crt:ro"
      - "./certs/selfsigned.key:/etc/certs/selfsigned.key:ro"
      - "../../config/traefik/dynamic/local-tls.yml:/etc/traefik/dynamic/local-tls.yml:ro"

  # Dev only. cryptography 47+ crashes in OpenSSL's ARM probe on Colima on an
  # M4 (exit 132), and this skips the probe. Production keeps it on.
  dagster-daemon:
    environment:
      OPENSSL_armcap: "0"
  dagster-webserver:
    environment:
      OPENSSL_armcap: "0"
  dagster-code:
    environment:
      OPENSSL_armcap: "0"
