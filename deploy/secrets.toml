# Every credential of the platform. `just docker-secrets` and `just local-secrets` generate them.
# The .env name is the Secret without "srdp-" plus the key: srdp-zitadel/db-password is ZITADEL_DB_PASSWORD.
# Formats: alnum:N, hex:N (N bytes), garage-key-id, zitadel-password, placeholder (CHANGE_ME_).

[[secret]]
secret = "srdp-postgres"
key = "password"
format = "alnum:24"

[[secret]]
secret = "srdp-zitadel"
key = "masterkey"
format = "alnum:32"

[[secret]]
secret = "srdp-zitadel"
key = "db-password"
format = "alnum:24"

[[secret]]
secret = "srdp-zitadel"
key = "admin-password"
format = "zitadel-password"

# Zitadel creates the OIDC client, see `just local-oidc-client` and provision-oidc.sh.
[[secret]]
secret = "srdp-oauth2-proxy"
key = "client-id"
format = "placeholder"

[[secret]]
secret = "srdp-oauth2-proxy"
key = "client-secret"
format = "placeholder"

[[secret]]
secret = "srdp-oauth2-proxy"
key = "cookie-secret"
format = "alnum:32"

[[secret]]
secret = "srdp-dagster"
key = "postgresql-password"
format = "alnum:24"

[[secret]]
secret = "srdp-marquez"
key = "db-password"
format = "alnum:24"

[[secret]]
secret = "srdp-ducklake-pg-writer"
key = "password"
format = "alnum:24"

[[secret]]
secret = "srdp-ducklake-pg-reader"
key = "password"
format = "alnum:24"

[[secret]]
secret = "srdp-ducklake-s3-writer"
key = "key-id"
format = "garage-key-id"

[[secret]]
secret = "srdp-ducklake-s3-writer"
key = "secret"
format = "hex:32"

[[secret]]
secret = "srdp-ducklake-s3-reader"
key = "key-id"
format = "garage-key-id"

[[secret]]
secret = "srdp-ducklake-s3-reader"
key = "secret"
format = "hex:32"

[[secret]]
secret = "srdp-garage"
key = "rpc-secret"
format = "hex:32"

[[secret]]
secret = "srdp-garage"
key = "admin-token"
format = "hex:16"
