# Every credential of the platform, generated once for the local stacks by
# src/srdp/setup/local_secrets.py (`just docker-secrets`, `just local-secrets`).
# Elsewhere, the operator creates the same Secrets with the same keys, by hand or
# from its own secret manager.
#
# secret  the Kubernetes Secret, key  the key in it. The variable in deploy/docker/.env
#         is the Secret without "srdp-" plus the key, in capitals with "_" for "-", so
#         srdp-zitadel/db-password is ZITADEL_DB_PASSWORD.
# format  alnum:N (letters and digits), hex:N (N random bytes as hex), garage-key-id
#         (GK + 24 hex), zitadel-password (with upper, lower, digit and symbol), or
#         placeholder (a CHANGE_ME_ value, for what another tool creates).
#
# A new component adds its entries here. The tests check that the chart, Compose and
# .env.example ask for nothing that is missing here.

[[secret]]
secret = "srdp-postgres"
key = "password"
format = "alnum:24"

[[secret]]
secret = "srdp-zitadel"
key = "masterkey"
format = "alnum:32"

[[secret]]
secret = "srdp-zitadel"
key = "db-password"
format = "alnum:24"

[[secret]]
secret = "srdp-zitadel"
key = "admin-password"
format = "zitadel-password"

# Zitadel creates the OIDC client, see `just local-oidc-client` and provision-oidc.sh.
[[secret]]
secret = "srdp-oauth2-proxy"
key = "client-id"
format = "placeholder"

[[secret]]
secret = "srdp-oauth2-proxy"
key = "client-secret"
format = "placeholder"

[[secret]]
secret = "srdp-oauth2-proxy"
key = "cookie-secret"
format = "alnum:32"

[[secret]]
secret = "srdp-dagster"
key = "postgresql-password"
format = "alnum:24"

[[secret]]
secret = "srdp-marquez"
key = "db-password"
format = "alnum:24"

[[secret]]
secret = "srdp-ducklake-pg-writer"
key = "password"
format = "alnum:24"

[[secret]]
secret = "srdp-ducklake-pg-reader"
key = "password"
format = "alnum:24"

[[secret]]
secret = "srdp-ducklake-s3-writer"
key = "key-id"
format = "garage-key-id"

[[secret]]
secret = "srdp-ducklake-s3-writer"
key = "secret"
format = "hex:32"

[[secret]]
secret = "srdp-ducklake-s3-reader"
key = "key-id"
format = "garage-key-id"

[[secret]]
secret = "srdp-ducklake-s3-reader"
key = "secret"
format = "hex:32"

[[secret]]
secret = "srdp-garage"
key = "rpc-secret"
format = "hex:32"

[[secret]]
secret = "srdp-garage"
key = "admin-token"
format = "hex:16"
