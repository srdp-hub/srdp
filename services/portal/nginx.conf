server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # Browsers revalidate every file, so a new release shows straight away.
    # The files are small and nginx answers an unchanged file with 304.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
