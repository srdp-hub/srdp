# Makes DuckDB UI's server-side localhost/origin check pass when reached through
# Traefik, by presenting the request exactly as a genuine, unproxied
# http://localhost:4213 client would. TLS is already terminated by Traefik
# upstream, so this only needs to rewrite HTTP headers, not handle certs.
#
# Adapted from the proven fix in skyscopetech/duckdb-ui-remote-docker, which
# hit and solved this exact problem (their HAProxy also terminates TLS itself,
# not needed here since Traefik already does it before this container sees
# anything).
global
    maxconn 4096
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    # /localEvents is a long-lived EventSource (SSE) stream, not request/response
    # — 30s defaults would kill it on a schedule, forcing the browser's silent
    # auto-reconnect. 1h is generous for a local single-user dev tool.
    timeout client 1h
    timeout server 1h
    log global
    option httplog

frontend http_front
    bind *:4213
    default_backend duckdb_ui_backend

backend duckdb_ui_backend
    server duckdb_ui [::1]:4213
    http-request set-header Host localhost:4213
    http-request set-header Origin http://localhost:4213
    http-request set-header Referer http://localhost:4213/
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Port
    http-request del-header X-Forwarded-Host
